reviewStatus: pending
name: "Amendoim"
summary: "A GoodBiz Agri exporta amendoim descascado — bold runner, Java e blanched, em calibres de 38/42 a 80/90 — originário de Chitradurga, em Karnataka, Anantapur, em Andhra Pradesh, e Tiruvannamalai, em Tamil Nadu."
originLine: "Chitradurga, Anantapur e Tiruvannamalai"
sourcingStory: "O árido planalto do Decão, em torno de Anantapur e Chitradurga, é uma das maiores regiões produtoras de amendoim da Índia. Compramos os grãos após a colheita, classificamos por calibre e testamos quanto a aflatoxina antes de embalar."
varieties:
  bold-runner: { name: "Bold (runner)", description: "Grãos grandes e alongados para torra e snacks." }
  java: { name: "Java (Spanish)", description: "Grãos redondos, com alto teor de óleo, para confeitaria e esmagamento." }
  blanched: { name: "Blanched (sem pele)", description: "Sem pele, inteiros ou partidos, com baixa aflatoxina." }
faq:
  - { q: "Qual é o código HSN dos grãos de amendoim?", a: "O amendoim descascado é classificado sob o HSN 1202 42. Estamos confirmando a linha de 8 dígitos." }
  - { q: "Vocês atendem aos limites de aflatoxina da UE?", a: "Sim, com lotes selecionados e testes de terceiros até ≤ 4 ppb de aflatoxina total, sob consulta." }
  - { q: "Quais calibres estão disponíveis?", a: "De 38/42 a 80/90 grãos por onça, conforme a variedade." }
