reviewStatus: pending
name: "Gengibre"
summary: "A GoodBiz Agri exporta gengibre fresco, gengibre seco não branqueado, gengibre seco branqueado e outros gengibres inteiros de Wayanad, em Kerala, e de Kodagu e Hassan, em Karnataka."
originLine: "Wayanad, Kodagu e Hassan — o cinturão do gengibre dos Gates Ocidentais"
sourcingStory: "O gengibre cultivado nas encostas dos Gates Ocidentais é conhecido pela pungência e pelo teor de óleo. Compramos gengibre fresco de produtores de Wayanad durante a colheita e gengibre seco pelo comércio de especiarias de Kochi, onde a classe «Cochin ginger» é negociada há séculos."
varieties:
  fresh: { name: "Gengibre fresco", description: "Rizomas lavados e secos ao ar, embalados em caixas de papelão ou sacos de malha para embarque em contêiner refrigerado." }
  dried-unbleached: { name: "Gengibre seco não branqueado", description: "Gengibre descascado e seco ao sol, com cor natural." }
  dried-bleached: { name: "Gengibre seco branqueado", description: "Branqueado com cal para aparência clara e uniforme." }
  whole-other: { name: "Gengibre seco inteiro (outros)", description: "Gengibre inteiro, nem triturado nem moído, conforme a classe do comprador." }
faq:
  - { q: "Como o gengibre fresco é embarcado?", a: "Em contêineres refrigerados de 40 pés a cerca de 12–13 °C, com capacidade para cerca de 26 toneladas." }
