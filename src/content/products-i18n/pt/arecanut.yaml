reviewStatus: pending
name: "Noz de areca"
summary: "A GoodBiz Agri exporta noz de areca (bétele) — chali branca inteira, partida, kempu vermelha (classes api e bette) e fatiada — originária de Shivamogga e Dakshina Kannada, em Karnataka, e de Kasaragod, em Kerala."
originLine: "Shivamogga, Dakshina Kannada e Kasaragod"
sourcingStory: "Karnataka produz a maior parte da noz de areca da Índia. A litorânea Dakshina Kannada e Kasaragod são conhecidas pela chali branca seca ao sol, negociada no mercado cooperativo de Puttur, enquanto a região de Malnad, em Shivamogga, se especializa em classes vermelhas cozidas."
varieties:
  whole-chali: { name: "Branca inteira (chali)", description: "Nozes inteiras secas ao sol com interior branco." }
  split: { name: "Noz de areca partida", description: "Nozes cortadas ao meio para processadores." }
  red-kempu: { name: "Vermelha (kempu) — api e bette", description: "Classes vermelho-amarronzadas, cozidas e secas, de Shivamogga." }
  sliced: { name: "Noz de areca fatiada", description: "Fatias uniformes para mercados de consumo direto." }
faq:
  - { q: "Qual é a diferença entre chali e kempu?", a: "A chali é a noz inteira seca ao sol do litoral de Karnataka; a kempu é cozida e seca, o que lhe dá a cor vermelha." }
