name: "Arroz não basmati"
summary: "A GoodBiz Agri exporta arroz não basmati a granel — IR64 cru e parboilizado, Swarna e IR36 em classes de 5% e 25% de quebrados — de usinas do delta do Godavari, Nellore e Raichur."
originLine: "Usinas do delta do Godavari, Nellore e Raichur"
sourcingStory: "O delta do Godavari e o distrito de Nellore, em Andhra Pradesh, estão entre os maiores celeiros de arroz da Índia. Contratamos usinas equipadas com sortex para obter IR64 e Swarna consistentes nas classes de quebrados que importadores africanos e asiáticos especificam."
