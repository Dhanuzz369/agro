name: "Cocopeat (Coco Pith)"
summary: "GoodBiz Agri mengekspor cocopeat (coco pith) — blok 5 kg, grow bag, campuran cocopeat dan cocochip, bata dan cocochip — dari pemasok sabut kelapa di Karnataka, Tamil Nadu dan Kerala, grade buffered, washed atau mentah, diuji lab untuk EC, pH dan pasir."
originLine: "Karnataka, Tamil Nadu dan Kerala — beberapa pemasok sabut kelapa"
sourcingStory: "Cocopeat adalah bahan halus dan seperti spons yang tersisa saat serat diambil dari sabut kelapa. Kami membelinya dari beberapa pemasok di Karnataka, Tamil Nadu dan Kerala dan memilih pemasok untuk setiap pesanan berdasarkan format, grade dan EC yang dibutuhkan petani. Setiap lot diuji di laboratorium untuk EC, pH dan pasir sebelum dikemas."
varieties:
  block-5kg: { name: "Blok cocopeat 5 kg", description: "Blok padat 5:1 yang mengembang menjadi 65–80 liter media tanam, grade buffered, washed atau mentah." }
  grow-bags: { name: "Grow bag dan slab", description: "Kantong siap tanam untuk stroberi, tomat dan mentimun, atas terbuka atau dengan lubang tanam siap pakai." }
  pith-chip-mix: { name: "Campuran cocopeat dan cocochip", description: "Cocopeat dicampur 70:30 atau 50:50 dengan cocochip agar pot beri dan alpukat lebih berongga." }
  bricks-discs: { name: "Bata, cakram dan pelet", description: "Bata 650 g, cakram dan pelet untuk pembibitan dan ritel berkebun, dengan merek Anda." }
