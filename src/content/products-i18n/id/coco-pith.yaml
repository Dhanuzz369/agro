faq:
  - { q: "Grade EC cocopeat apa saja yang bisa Anda pasok?", a: "Cocopeat buffered di bawah 0,5 mS/cm, washed 0,5–1,0 mS/cm dan mentah mulai 1,5 mS/cm. Setiap lot diuji lab untuk EC, pH dan pasir, dan kontrak menyebutkan metode uji EC (misalnya 1:5 menurut EN 13038), karena metode yang berbeda memberi hasil berbeda untuk bahan yang sama." }
  - { q: "Apa beda cocopeat buffered dan washed?", a: "Pencucian membilas sebagian besar garam natrium dan kalium. Buffering lebih jauh lagi: cocopeat diberi kalsium nitrat agar natrium dan kalium yang terikat pada serat tergantikan, sehingga media tidak mengikat kalsium dan magnesium yang dibutuhkan tanaman. Rumah kaca stroberi, tomat dan mentimun biasanya meminta cocopeat buffered." }
  - { q: "Seberapa besar blok 5 kg mengembang?", a: "Blok 5 kg dipadatkan sekitar 5:1 dan mengembang menjadi 65–80 liter media lepas setelah direndam." }
  - { q: "Format dan opsi merek sendiri apa yang Anda tawarkan?", a: "GoodBiz Agri memasok blok 5 kg, grow bag dan slab, campuran cocopeat dan cocochip 70:30 dan 50:50, bata 650 g, cakram, pelet dan cocochip. Bata dan kantong ritel bisa dikemas dengan merek Anda sendiri." }
  - { q: "Dokumen apa yang menyertai pengiriman cocopeat?", a: "Setiap pengiriman disertai sertifikat fitosanitasi dari badan karantina tumbuhan India, sertifikat asal dan hasil analisis lab. Fumigasi dilakukan oleh perusahaan terakreditasi bila negara tujuan memintanya, dan beberapa negara menambah syarat sendiri, misalnya palet ISPM-15." }
  - { q: "Apakah cocopeat boleh diimpor ke UE dan Inggris?", a: "Ya. Peraturan UE 2019/2072, Lampiran VI, mengecualikan media tanam yang seluruhnya terbuat dari serat kelapa yang belum dipakai dari pembatasan tanah dan media tanam, dan Inggris menerapkan pengecualian yang sama. Setiap pengiriman disertai sertifikat fitosanitasi." }
