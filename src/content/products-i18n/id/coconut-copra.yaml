summary: "GoodBiz Agri mengekspor kelapa setengah kupas dan kopra — kopra bola Tiptur, kopra giling dan mangkuk kopra pangan — dari Tiptur dan Tumakuru di Karnataka serta Pollachi di Tamil Nadu, dikirim dari New Mangalore, Kochi dan Chennai ke Teluk, Asia Selatan dan pasar lain."
originLine: "Tiptur, Tumakuru, dan Pollachi"
sourcingStory: "Tiptur di distrik Tumakuru terkenal dengan kopra bola — daging buah utuh yang dikeringkan perlahan di dalam tempurung sehingga manis dan putih. Kami membelinya di sana, kopra giling dari pedagang Tumakuru, dan kelapa setengah sabut segar dari pasar Pollachi yang buka sepanjang tahun."
