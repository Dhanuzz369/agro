name: "Kelapa dan Kopra"
summary: "GoodBiz Agri mengekspor kelapa setengah sabut dan kopra (kobre) — kopra bola Tiptur, kopra giling, dan cawan kopra konsumsi — yang bersumber dari Tiptur dan Tumakuru di Karnataka serta Pollachi di Tamil Nadu."
originLine: "Tiptur, Tumakuru, dan Pollachi"
sourcingStory: "Tiptur di distrik Tumakuru terkenal dengan kopra bola — daging buah utuh yang dikeringkan perlahan di dalam tempurung sehingga manis dan putih. Kami membelinya di sana, kopra giling dari pedagang Tumakuru, dan kelapa setengah sabut segar dari pasar Pollachi yang buka sepanjang tahun."
varieties:
  semi-husked: { name: "Kelapa setengah sabut", description: "Kelapa tua dengan sabut sebagian, dikemas dalam karung jaring." }
  tiptur-ball-copra: { name: "Kopra bola Tiptur", description: "Kopra konsumsi utuh yang dikeringkan perlahan dengan daging buah putih yang manis." }
  milling-copra: { name: "Kopra giling", description: "Kopra cawan untuk ekstraksi minyak." }
  edible-cups: { name: "Cawan kopra konsumsi", description: "Setengah cawan untuk penggunaan pangan." }
faq:
  - { q: "Apa itu kopra bola Tiptur?", a: "Kopra yang dikeringkan utuh di dalam tempurung hingga satu tahun, menghasilkan daging buah putih yang manis dan digemari di kawasan Teluk dan Asia Selatan." }
  - { q: "Apakah kelapa tersedia sepanjang tahun?", a: "Ya. Pollachi memasok kelapa setengah sabut sepanjang tahun." }
