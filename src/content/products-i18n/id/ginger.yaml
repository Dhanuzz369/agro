name: "Jahe"
summary: "GoodBiz Agri mengekspor jahe kering (tanpa pemutih dan diputihkan), jahe kering utuh lainnya dan jahe segar dari Wayanad di Kerala serta Kodagu dan Hassan di Karnataka, dikirim dari Kochi, New Mangalore dan Chennai — jahe segar dengan kontainer reefer."
originLine: "Wayanad, Kodagu, dan Hassan — sabuk jahe Ghats Barat"
sourcingStory: "Jahe yang tumbuh di lereng Ghats Barat dikenal karena rasa pedas dan kandungan minyaknya. Kami membeli jahe segar dari petani Wayanad pada musim panen dan jahe kering melalui perdagangan rempah Kochi, tempat mutu \"Cochin ginger\" telah diperdagangkan selama berabad-abad."
varieties:
  fresh: { name: "Jahe segar", description: "Rimpang dicuci dan dikeringanginkan, dikemas dalam karton atau karung jaring untuk pengiriman reefer." }
  dried-unbleached: { name: "Jahe kering tanpa pemutih", description: "Jahe dikupas dan dijemur dengan warna alami." }
  dried-bleached: { name: "Jahe kering diputihkan", description: "Diputihkan dengan kapur agar tampak pucat dan seragam." }
  whole-other: { name: "Jahe kering utuh (lainnya)", description: "Jahe utuh yang tidak dihancurkan maupun digiling, sesuai mutu pembeli." }
faq:
  - { q: "Bagaimana jahe segar dikirim?", a: "Jahe segar dikirim dalam kontainer reefer 40 kaki pada suhu sekitar 12–13 °C, sekitar 26 ton per kontainer." }
  - { q: "Dari pelabuhan mana jahe dikirim?", a: "GoodBiz Agri mengirim jahe kering dan segar dari Kochi, New Mangalore dan Chennai dengan syarat FOB, CFR atau CIF." }
