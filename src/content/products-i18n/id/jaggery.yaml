name: "Jaggery"
summary: "GoodBiz Agri mengekspor jaggery — blok, kubus, bubuk, jaggery organik dan gula aren (karupatti) — dari Mandya dan Belagavi di Karnataka dan Thoothukudi di Tamil Nadu, dikirim dari pelabuhan India yang sesuai untuk setiap pesanan ke lebih dari 70 negara."
originLine: "Mandya, Belagavi, dan Thoothukudi"
sourcingStory: "Sabuk tebu Mandya telah membuat jaggery selama beberapa generasi dengan memasak air tebu segar di wajan terbuka. Kami membeli balok dan jaggery organik di sana, kubus dan bubuk dari pengolah di Belagavi, serta jaggery aren dari penyadap palmira di Thoothukudi."
