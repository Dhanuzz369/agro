sourcingStory: "腰果仁到我们手中时已完成脱壳、去皮和分级。我们从喀拉拉邦、卡纳塔克邦和泰米尔纳德邦的多家加工厂采购，并按买家所需的等级、颜色和数量为每笔订单选定加工厂。每批货都经实验室检测水分和黄曲霉毒素，然后真空装入铁罐或软袋。"
varieties:
  white-wholes: { name: "白整仁（W180–W450）", description: "按每磅粒数分级的白色整仁，从大粒 W180 到小粒 W450；W320 是交易量最大的等级。" }
  scorched-wholes: { name: "焦黄整仁（SW）", description: "带壳烘烤时间较长、略呈浅褐色的整仁，价格低于白整仁。" }
  splits-butts: { name: "对开仁和断仁（S、B）", description: "纵向对开（S）或横向断开（B）的腰果仁，用于糖果和烘焙。" }
  pieces: { name: "腰果碎仁（LWP、SWP、BB）", description: "大白碎、小白碎和碎粒，用于零食、甜品和配料。" }
faq:
  - { q: "腰果等级 W180、W240 和 W320 是什么意思？", a: "W 代表白整仁，数字是每磅的粒数。W180 每磅 170–180 粒，颗粒大；W320 每磅 300–320 粒；W450 每磅 400–450 粒，是最小的整仁等级。W320 是交易量最大的等级。" }
  - { q: "整仁、对开仁和碎仁有什么区别？", a: "整仁没有破损。对开仁（S）沿长度自然裂开，断仁（B）横向断开，碎仁按大小分为大白碎（LWP）、小白碎（SWP）和碎粒（BB）。对开仁和碎仁价格较低，适合烘焙、甜品和混合零食。" }
  - { q: "你们的腰果仁水分和保质期如何？", a: "腰果仁烘干至水分 5% 以下，装入真空或充氮铁罐，在阴凉干燥处可保存约 12 个月。" }
  - { q: "腰果仁如何包装？", a: "标准出口包装为每箱两罐 25 磅（22.68 公斤）真空铁罐，每箱 50 磅；一个 20 英尺集装箱约装 700 箱。可应要求提供 10 公斤真空软袋和贴牌包装。" }
  - { q: "腰果仁检测黄曲霉毒素吗？", a: "检测。每批货发运前都按目的市场限量经实验室检测水分和黄曲霉毒素，并可应要求安排第三方检验。" }
