reviewStatus: pending
name: "生姜"
summary: "GoodBiz Agri 出口鲜姜、未漂白干姜、漂白干姜及其他整姜，产自喀拉拉邦的瓦亚纳德，以及卡纳塔克邦的科达古和哈桑。"
originLine: "瓦亚纳德、科达古和哈桑——西高止山生姜产带"
sourcingStory: "西高止山坡上种植的生姜以辛辣度高、含油量高著称。收获季我们从瓦亚纳德姜农处采购鲜姜，干姜则通过科钦的香料贸易采购，“Cochin ginger”（科钦姜）这一等级已交易数百年。"
varieties:
  fresh: { name: "鲜姜", description: "清洗并风干的姜块，纸箱或网袋包装，冷藏集装箱运输。" }
  dried-unbleached: { name: "未漂白干姜", description: "去皮日晒干姜，保持天然色泽。" }
  dried-bleached: { name: "漂白干姜", description: "石灰漂白，外观浅淡均匀。" }
  whole-other: { name: "整干姜（其他）", description: "未经破碎或研磨的整姜，按买方等级供货。" }
faq:
  - { q: "鲜姜如何运输？", a: "使用40英尺冷藏集装箱，温度约12–13 °C，装载量约26吨。" }
