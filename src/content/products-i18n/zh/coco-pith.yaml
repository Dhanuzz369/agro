  grow-bags: { name: "种植袋和种植条", description: "可直接定植的种植袋，适用于草莓、番茄和黄瓜，开口式或预切定植孔。" }
  pith-chip-mix: { name: "椰糠椰块混合基质", description: "椰糠与椰块按 70:30 或 50:50 混合，增加蓝莓和牛油果盆栽的透气性。" }
