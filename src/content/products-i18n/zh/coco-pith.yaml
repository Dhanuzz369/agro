summary: "GoodBiz Agri 出口椰糠（coco pith、cocopeat）——5 公斤椰糠砖、种植袋、椰糠与椰块混合基质、小砖及椰块——采购自卡纳塔克邦、泰米尔纳德邦和喀拉拉邦的多家椰棕供应商，提供缓冲型、水洗型或原料型，逐批实验室检测 EC、pH 和含沙量。"
originLine: "卡纳塔克邦、泰米尔纳德邦和喀拉拉邦——多家椰棕供应商"
sourcingStory: "椰糠是从椰子壳中抽取纤维后剩下的细软、海绵状材料。我们从卡纳塔克邦、泰米尔纳德邦和喀拉拉邦的多家供应商采购，并按种植者所需的规格、等级和 EC 为每笔订单选定供应商。每批货在包装前都经实验室检测 EC、pH 和含沙量。"
varieties:
