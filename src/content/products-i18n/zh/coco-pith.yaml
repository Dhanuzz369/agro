  husk-chips: { name: "椰块", description: "分级椰壳块，适用于兰花、番茄和辣椒，也可用于透气混合基质。" }
faq:
  - { q: "你们能供应哪些 EC 等级的椰糠？", a: "缓冲型低于 0.5 mS/cm，水洗型 0.5–1.0 mS/cm，原料型 1.5 mS/cm 及以上。每批货都检测 EC、pH 和含沙量，合同中注明 EC 检测方法（例如按 EN 13038 的 1:5 法），因为同一材料用不同方法测得的数值不同。" }
  - { q: "缓冲型和水洗型椰糠有什么区别？", a: "水洗能冲掉大部分钠盐和钾盐。缓冲处理更进一步：用硝酸钙处理椰糠，置换纤维上吸附的钠和钾，使基质不会固定作物所需的钙和镁。种植草莓、番茄和黄瓜的温室通常要求缓冲型椰糠。" }
  - { q: "5 公斤椰糠砖能泡发多少？", a: "5 公斤椰糠砖约按 5:1 压缩，浸泡后可得到 65–80 升松散基质。" }
  - { q: "你们提供哪些规格和贴牌选项？", a: "GoodBiz Agri 供应 5 公斤椰糠砖、种植袋和种植条、70:30 和 50:50 椰糠椰块混合基质、650 克小砖、圆片、育苗块和椰块。零售小砖和袋装产品可贴您的品牌。" }
  - { q: "椰糠出货随附哪些单证？", a: "每批货随附印度植物检疫机构签发的植物检疫证书、原产地证书和实验室分析报告。目的国要求时由认可机构熏蒸，部分国家另有要求，例如 ISPM-15 托盘。" }
  - { q: "椰糠能进口到欧盟和英国吗？", a: "可以。欧盟第 2019/2072 号法规附件六对完全由未使用椰子纤维制成的栽培基质免除土壤和栽培基质限制，英国适用同样的豁免。每批货随附植物检疫证书。" }
