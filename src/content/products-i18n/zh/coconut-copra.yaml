name: "椰子与椰干"
summary: "GoodBiz Agri 出口半去壳椰子和椰干（kobre，科布雷）——Tiptur（蒂普图尔）球形椰干、榨油用椰干和食用椰干杯——产自卡纳塔克邦的蒂普图尔和图姆库鲁，以及泰米尔纳德邦的波拉奇。"
originLine: "蒂普图尔、图姆库鲁和波拉奇"
sourcingStory: "图姆库鲁县的蒂普图尔以球形椰干闻名——整颗椰肉在壳内缓慢晒干，成品味甜色白。我们在当地采购球形椰干，从图姆库鲁贸易商处采购榨油用椰干，并从全年开市的波拉奇市场采购新鲜半去壳椰子。"
