name: "花生"
summary: "GoodBiz Agri 出口花生仁（落花生）——大粒 bold runner（大粒伦那型）、Java（爪哇型）和去皮花生，粒数规格从38/42到80/90——产自卡纳塔克邦的奇特拉杜尔加、安得拉邦的阿南塔布尔和泰米尔纳德邦的蒂鲁沃纳马莱。"
originLine: "奇特拉杜尔加、阿南塔布尔和蒂鲁沃纳马莱"
sourcingStory: "阿南塔布尔和奇特拉杜尔加周边干燥的德干高原是印度最大的花生产区之一。我们在收获后采购花生仁，按粒数分级，并在包装前检测黄曲霉毒素。"
varieties:
  bold-runner: { name: "大粒型（runner）", description: "粒大形长，适用于烘烤和休闲食品。" }
  java: { name: "Java（西班牙型）", description: "圆粒、含油量高，适用于糖果糕点和榨油。" }
  blanched: { name: "去皮花生", description: "去除红衣，整粒或对半，黄曲霉毒素低。" }
faq:
  - { q: "花生仁的 HSN 编码是什么？", a: "花生仁归入 HSN 1202 42。我们正在核实8位税号。" }
  - { q: "能满足欧盟黄曲霉毒素限量吗？", a: "可以，经分选并由第三方检测，应要求可达到总黄曲霉毒素 ≤ 4 ppb。" }
  - { q: "有哪些粒数规格？", a: "每盎司38/42至80/90粒，视品种而定。" }
