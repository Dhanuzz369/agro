reviewStatus: pending
name: "姜黄"
summary: "GoodBiz Agri 出口鲜姜黄（HSN 09103010）、干姜黄指和球茎（HSN 09103020）及姜黄粉（HSN 09103030），产自泰米尔纳德邦的埃罗德和塞勒姆，以及喀拉拉邦的阿勒皮（Alleppey），姜黄素含量2%至5%，水分低于10%。"
originLine: "埃罗德、塞勒姆和阿勒皮——印度姜黄核心产区"
sourcingStory: "埃罗德的监管市场决定着全球大量姜黄的价格。每个收获季，我们在当地和塞勒姆采购抛光的指状和球茎姜黄，并从喀拉拉邦贸易商处采购高姜黄素的 Alleppey 指状姜黄，供需要色价强度的买家使用。姜黄粉按订单研磨，使姜黄素含量和目数符合您的规格。"
varieties:
  fresh: { name: "鲜姜黄", description: "清洗风干的根茎，通风纸箱包装，冷藏运输。" }
  dried-finger: { name: "Erode 干姜黄指", description: "煮制、日晒并抛光的姜黄指，姜黄素含量2.5–3.5%。" }
  alleppey-finger: { name: "Alleppey 姜黄指", description: "喀拉拉邦高姜黄素姜黄，适用于提取和着色。" }
  salem-bulb: { name: "Salem 球茎", description: "来自塞勒姆的圆形球茎，适合研磨。" }
  powder: { name: "姜黄粉", description: "按订单研磨，60–80目，姜黄素分级2–5%。" }
faq:
  - { q: "姜黄粉的 HSN 编码是什么？", a: "姜黄粉归入 HSN 09103030。干整姜黄为 09103020，鲜姜黄为 09103010。" }
  - { q: "你们能供应什么姜黄素含量？", a: "Erode 和 Salem 姜黄的姜黄素含量通常为2.5–4%；Alleppey 姜黄指为4.5–5%。姜黄粉可按指定姜黄素含量调配。" }
  - { q: "姜黄何时收获？", a: "主要收获期为1月至4月，埃罗德的鲜姜黄自2月起上市。" }
  - { q: "能满足欧盟农药残留限量吗？", a: "可以。我们按欧盟 MRL 采购并检测批次，装运前可提供第三方分析报告。" }
