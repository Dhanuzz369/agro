name: "槟榔"
summary: "GoodBiz Agri 出口槟榔（又称蒌叶果）——整颗白色 chali（查利）、对半切 split、红色 kempu（肯普；api 和 bette 等级）以及切片——产自卡纳塔克邦的希莫加和南卡纳拉，以及喀拉拉邦的卡萨拉戈德。"
originLine: "希莫加、南卡纳拉和卡萨拉戈德"
sourcingStory: "卡纳塔克邦出产印度大部分槟榔。沿海的南卡纳拉和卡萨拉戈德以日晒白色 chali 闻名，通过普图尔合作社市场交易；希莫加的马尔纳德地区则专营煮制红色等级。"
varieties:
