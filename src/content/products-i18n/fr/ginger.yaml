name: "Gingembre"
summary: "GoodBiz Agri exporte du gingembre séché (non blanchi et blanchi), d'autres gingembres séchés entiers et du gingembre frais du Wayanad au Kerala et de Kodagu et Hassan au Karnataka, expédiés depuis le port indien adapté à chaque commande — le frais en conteneur réfrigéré."
originLine: "Wayanad, Kodagu et Hassan — la ceinture du gingembre des Ghâts occidentaux"
sourcingStory: "Le gingembre cultivé sur les pentes des Ghâts occidentaux est réputé pour son piquant et sa teneur en huile. Nous achetons le gingembre frais auprès des producteurs de Wayanad pendant la récolte, et le gingembre séché via le commerce des épices de Kochi, où la qualité « Cochin ginger » se négocie depuis des siècles."
varieties:
  fresh: { name: "Gingembre frais", description: "Mains lavées et séchées à l'air, emballées en cartons ou sacs filet pour expédition en conteneur réfrigéré." }
  dried-unbleached: { name: "Gingembre séché non blanchi", description: "Gingembre pelé et séché au soleil, de couleur naturelle." }
  dried-bleached: { name: "Gingembre séché blanchi", description: "Blanchi à la chaux pour un aspect clair et uniforme." }
  whole-other: { name: "Gingembre entier séché (autre)", description: "Gingembre entier, ni broyé ni moulu, selon la qualité de l'acheteur." }
faq:
  - { q: "Comment le gingembre frais est-il expédié ?", a: "Le gingembre frais voyage en conteneurs réfrigérés de 40 pieds à environ 12–13 °C, soit près de 26 tonnes par conteneur." }
  - { q: "Depuis quels ports expédiez-vous le gingembre ?", a: "GoodBiz Agri expédie le gingembre séché et frais depuis le port indien adapté à chaque commande aux conditions FOB, CFR ou CIF." }
