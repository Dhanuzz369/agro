reviewStatus: pending
name: "Riz d'Inde du Sud"
summary: "GoodBiz Agri exporte des riz spéciaux d'Inde du Sud — Sona Masoori (cru et étuvé), Ponni, Kerala Matta, Seeraga Samba et riz pour idli — usinés à Raichur, Mandya, Thanjavur et Palakkad."
originLine: "Rizeries de Raichur, Mandya, Thanjavur et Palakkad"
sourcingStory: "Le riz d'Inde du Sud est plus léger et plus varié que les riz à grain long que la plupart des acheteurs connaissent. Nous achetons le Sona Masoori dans la zone irriguée de la Tungabhadra autour de Raichur, le Ponni et le Seeraga Samba dans les rizeries du delta de la Kaveri à Thanjavur, et le Matta à Palakkad, en adaptant chaque lot au plat et au marché auxquels il est destiné."
varieties:
  sona-masoori-raw: { name: "Sona Masoori (cru)", description: "Riz léger à grain moyen, aliment de base quotidien des cuisines d'Inde du Sud." }
  sona-masoori-steam: { name: "Sona Masoori (étuvé)", description: "Étuvé avant l'usinage pour des grains plus fermes et une meilleure conservation." }
  ponni: { name: "Ponni", description: "Riz tendre à grain moyen du Tamil Nadu, apprécié en Asie du Sud-Est et dans le Golfe." }
  kerala-matta: { name: "Kerala Matta", description: "Riz étuvé à son rouge de Palakkad, au goût de noisette." }
  seeraga-samba: { name: "Seeraga Samba", description: "Petit grain aromatique utilisé pour le biryani au Tamil Nadu." }
  idli-rice: { name: "Riz pour idli", description: "Riz étuvé à grain court et bien plein pour la pâte d'idli et de dosa." }
faq:
  - { q: "Quelle différence entre Sona Masoori cru et étuvé ?", a: "Le riz étuvé est légèrement étuvé avant l'usinage, ce qui donne des grains cuits plus fermes et une meilleure durée de stockage." }
  - { q: "Pouvez-vous fournir des sacs de détail en marque blanche ?", a: "Oui, en sacs BOPP ou jute de 5, 10 et 25 kg à votre marque." }
