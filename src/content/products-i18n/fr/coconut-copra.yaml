name: "Noix de coco et coprah"
summary: "GoodBiz Agri exporte des noix de coco semi-décortiquées et du coprah (kobre) — coprah en boule de Tiptur, coprah de trituration et demi-coques comestibles — d'origine Tiptur et Tumakuru au Karnataka et Pollachi au Tamil Nadu."
originLine: "Tiptur, Tumakuru et Pollachi"
sourcingStory: "Tiptur, dans le district de Tumakuru, est célèbre pour son coprah en boule — des amandes entières séchées lentement dans leur coque, pour un résultat doux et blanc. Nous l'y achetons, ainsi que le coprah de trituration auprès des négociants de Tumakuru et les noix de coco fraîches semi-décortiquées sur le marché de Pollachi, actif toute l'année."
varieties:
  semi-husked: { name: "Noix de coco semi-décortiquée", description: "Noix mûres à bourre partielle, emballées en sacs filet." }
  tiptur-ball-copra: { name: "Coprah en boule de Tiptur", description: "Coprah comestible entier, séché lentement, à l'amande blanche et douce." }
  milling-copra: { name: "Coprah de trituration", description: "Coprah en demi-coques pour l'extraction d'huile." }
  edible-cups: { name: "Demi-coques de coprah comestibles", description: "Demi-coques à usage alimentaire." }
faq:
  - { q: "Qu'est-ce que le coprah en boule de Tiptur ?", a: "Du coprah séché entier dans sa coque pendant jusqu'à un an, donnant une amande douce et blanche très appréciée dans le Golfe et en Asie du Sud." }
  - { q: "Les noix de coco sont-elles disponibles toute l'année ?", a: "Oui. Pollachi fournit des noix de coco semi-décortiquées tout au long de l'année." }
