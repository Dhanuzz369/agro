summary: "GoodBiz Agri exporte du riz brisé 100 % — blanc, étuvé et trié — depuis des rizeries du delta de la Godavari, de Nellore et de Raichur, expédié de Chennai et Tuticorin vers les importateurs d'Afrique de l'Ouest et d'Asie, les brasseries et les fabricants d'aliments."
