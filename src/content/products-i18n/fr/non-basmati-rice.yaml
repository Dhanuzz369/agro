name: "Riz non basmati"
summary: "GoodBiz Agri exporte du riz non basmati en vrac — IR64 cru et étuvé, Swarna et IR36 en qualités à 5 % et 25 % de brisures — issu de rizeries du delta de la Godavari, de Nellore et de Raichur."
originLine: "Rizeries du delta de la Godavari, de Nellore et de Raichur"
sourcingStory: "Le delta de la Godavari et le district de Nellore, en Andhra Pradesh, comptent parmi les plus grandes rizières de l'Inde. Nous contractons avec des rizeries équipées de trieuses optiques (sortex) pour obtenir un IR64 et un Swarna réguliers, dans les taux de brisures que spécifient les importateurs africains et asiatiques."
varieties:
  ir64-raw: { name: "IR64 cru", description: "Riz blanc à grain long en qualités à 5 % et 25 % de brisures." }
  ir64-parboiled: { name: "IR64 étuvé", description: "Étuvé pour un meilleur rendement et des grains plus fermes, très demandé en Afrique de l'Ouest." }
  swarna: { name: "Swarna", description: "Riz à grain moyen d'Andhra Pradesh, très utilisé au Bangladesh et en Afrique." }
  ir36: { name: "IR36", description: "Riz blanc à grain long pour les marchés sensibles au prix." }
faq:
  - { q: "Quels taux de brisures fournissez-vous ?", a: "5 % et 25 % de brisures en standard ; 10 % et 15 % sur demande." }
  - { q: "Existe-t-il une taxe à l'exportation sur le riz non basmati ?", a: "La politique indienne d'exportation du riz change périodiquement. Nous confirmons la position actuelle de la DGFT avant chaque contrat." }
