reviewStatus: pending
name: "Arachides"
summary: "GoodBiz Agri exporte des arachides décortiquées — bold runner, Java et blanchies, en calibres de 38/42 à 80/90 — d'origine Chitradurga au Karnataka, Anantapur en Andhra Pradesh et Tiruvannamalai au Tamil Nadu."
originLine: "Chitradurga, Anantapur et Tiruvannamalai"
sourcingStory: "Le plateau sec du Deccan autour d'Anantapur et de Chitradurga est l'une des plus grandes régions d'arachide de l'Inde. Nous achetons les amandes après la récolte, les trions par calibre et les testons pour l'aflatoxine avant l'emballage."
varieties:
  bold-runner: { name: "Bold (runner)", description: "Grosses amandes allongées pour la torréfaction et l'apéritif." }
  java: { name: "Java (Spanish)", description: "Amandes rondes riches en huile pour la confiserie et la trituration." }
  blanched: { name: "Blanchies", description: "Sans peau, entières ou fendues, à faible teneur en aflatoxine." }
faq:
  - { q: "Quel est le code SH des amandes d'arachide ?", a: "Les arachides décortiquées sont classées sous le code SH 1202 42. Nous confirmons la ligne à 8 chiffres." }
  - { q: "Pouvez-vous respecter les limites européennes d'aflatoxine ?", a: "Oui, avec des lots triés et des analyses par un tiers jusqu'à ≤ 4 ppb d'aflatoxines totales sur demande." }
  - { q: "Quels calibres sont disponibles ?", a: "De 38/42 à 80/90 amandes par once, selon la variété." }
