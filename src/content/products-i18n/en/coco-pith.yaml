name: Coco Pith
summary: GoodBiz Agri exports coco pith (cocopeat) — 5 kg blocks, grow bags, pith and chip mixes, bricks and husk chips — from coir suppliers in Karnataka, Tamil Nadu and Kerala, in buffered, washed or raw EC grades, lab-tested for EC, pH and sand.
originLine: Karnataka, Tamil Nadu and Kerala — several coir suppliers
sourcingStory: Coco pith is the fine, spongy material left when fibre is pulled from coconut husks. We buy it from several coir suppliers across Karnataka, Tamil Nadu and Kerala and choose the supplier for each order by the format, grade and EC the grower needs. Every lot is lab-tested for EC, pH and sand before it is packed.
