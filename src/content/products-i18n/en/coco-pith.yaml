faq:
  - { q: "What EC grades of coco pith can you supply?", a: "Buffered coco pith below 0.5 mS/cm, washed at 0.5–1.0 mS/cm and raw at 1.5 mS/cm and above. Every lot is lab-tested for EC, pH and sand, and the contract states the EC test method (for example 1:5 per EN 13038), because different methods give different readings for the same material." }
  - { q: "What is the difference between buffered and washed coco pith?", a: "Washing rinses out most of the sodium and potassium salts. Buffering goes further: the pith is treated with calcium nitrate so the sodium and potassium held on the fibre are replaced and the substrate does not lock up calcium and magnesium the crop needs. Greenhouse berry, tomato and cucumber growers usually ask for buffered pith." }
  - { q: "How much does a 5 kg coco pith block expand?", a: "A 5 kg block is compressed at about 5:1 and opens up to 65–80 litres of loose substrate once it is soaked." }
  - { q: "Which formats and private-label options do you offer?", a: "GoodBiz Agri supplies 5 kg blocks, grow bags and slabs, 70:30 and 50:50 pith and chip mixes, 650 g bricks, discs, pellets and husk chips. Retail bricks and bags can be packed under your own label." }
  - { q: "What documents come with a coco pith shipment?", a: "Every shipment carries a phytosanitary certificate from India's plant quarantine service, a certificate of origin and the lab analysis. Fumigation is done by an accredited agency where the destination asks for it, and some countries add their own conditions, such as ISPM-15 pallets." }
  - { q: "Can coco pith be imported into the EU and the UK?", a: "Yes. EU Regulation 2019/2072, Annex VI, exempts growing media made entirely of unused coconut fibre from the restrictions on soil and growing media, and the UK applies the same exemption. A phytosanitary certificate goes with each shipment." }
