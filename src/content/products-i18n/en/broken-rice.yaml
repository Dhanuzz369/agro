name: Broken Rice
summary: GoodBiz Agri exports 100% broken rice — white, parboiled and sortexed — from mills in the Godavari delta, Nellore and Raichur, shipped from Chennai and Tuticorin to food importers in West Africa and Asia and to brewers and feed mills.
