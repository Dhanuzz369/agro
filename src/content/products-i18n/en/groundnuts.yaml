name: Groundnuts
summary: GoodBiz Agri exports shelled groundnuts (peanut kernels) — bold runner, Java and blanched in counts from 38/42 to 80/90 — from Chitradurga, Anantapur and Tiruvannamalai, shipped from Chennai and New Mangalore with aflatoxin testing on request.
originLine: Chitradurga, Anantapur and Tiruvannamalai
sourcingStory: The dry Deccan plateau around Anantapur and Chitradurga is one of India's largest groundnut regions. We buy kernels after harvest, sort them by count and test for aflatoxin before packing.
