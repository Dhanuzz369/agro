name: Non-Basmati Rice
summary: GoodBiz Agri exports bulk non-basmati rice — IR64 raw and parboiled, Swarna and IR36 in 5% and 25% broken grades — from sortex mills in the Godavari delta, Nellore and Raichur, shipped from Chennai and Tuticorin to Africa, Asia and the Middle East.
