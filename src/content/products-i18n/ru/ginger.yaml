faq:
  - { q: "Какой код HSN у сушёного имбиря?", a: "Сушёный неотбелённый имбирь — HSN 09101120, сушёный отбелённый — 09101130. Свежий имбирь — 09101110." }
  - { q: "Как перевозят свежий имбирь?", a: "В 40-футовых рефрижераторных контейнерах при температуре около 12–13 °C, вместимостью около 26 тонн." }
  - { q: "Когда собирают имбирь?", a: "С декабря по март. Сушёный имбирь доступен круглый год со склада." }
  - { q: "Каков минимальный заказ?", a: "Один 20-футовый контейнер для сушёного имбиря или один 40-футовый рефрижератор для свежего." }
