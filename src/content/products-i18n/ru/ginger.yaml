summary: "GoodBiz Agri экспортирует свежий имбирь (HSN 09101110), сушёный неотбелённый имбирь (09101120), сушёный отбелённый имбирь (09101130) и прочий цельный имбирь (09101190) из Вайянада в Керале, а также Кодагу и Хассана в Карнатаке."
originLine: "Вайянад, Кодагу и Хассан — имбирный пояс Западных Гат"
sourcingStory: "Имбирь, выращенный на склонах Западных Гат, известен остротой и содержанием эфирного масла. Свежий имбирь мы закупаем у фермеров Вайянада в период сбора, а сушёный — через пряную торговлю Кочи, где сорт «Cochin ginger» (кочинский имбирь) торгуется веками."
