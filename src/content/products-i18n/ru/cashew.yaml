name: "Ядра кешью"
summary: "GoodBiz Agri экспортирует ядра кешью — целые W180, W210, W240, W320 и W450, подпалённые целые, половинки, ломаные и кусочки (LWP, SWP, BB) — от переработчиков Кералы, Карнатаки и Тамилнада, в вакуумной упаковке, с лабораторной проверкой влажности и афлатоксина."
originLine: "Керала, Карнатака и Тамилнад — несколько переработчиков"
sourcingStory: "Ядра кешью поступают к нам уже очищенными от скорлупы и плёнки и откалиброванными. Мы закупаем у нескольких переработчиков в Керале, Карнатаке и Тамилнаде и выбираем переработчика для каждого заказа по сорту, цвету и объёму, которые нужны покупателю. Каждую партию проверяют в лаборатории на влажность и афлатоксин, затем упаковывают под вакуумом в банки или гибкие пакеты."
varieties:
  white-wholes: { name: "Белые целые ядра (W180–W450)", description: "Целые белые ядра, откалиброванные по количеству штук на фунт, от крупного W180 до мелкого W450; W320 — самый ходовой сорт." }
  scorched-wholes: { name: "Подпалённые целые (SW)", description: "Целые ядра со светло-коричневым оттенком от более долгой обжарки в скорлупе, дешевле белых целых." }
  splits-butts: { name: "Половинки и ломаные (S, B)", description: "Ядра, расколотые вдоль (S) или поперёк (B), для кондитерской и хлебопекарной промышленности." }
  pieces: { name: "Кусочки кешью (LWP, SWP, BB)", description: "Крупные белые кусочки, мелкие белые кусочки и крошка для снеков, сладостей и ингредиентов." }
faq:
  - { q: "Что означают сорта кешью W180, W240 и W320?", a: "W обозначает белые целые ядра, а число — количество ядер на фунт. В W180 170–180 ядер на фунт, то есть ядра крупные; в W320 — 300–320; в W450 — 400–450, это самый мелкий целый сорт. W320 — самый ходовой сорт." }
  - { q: "Чем отличаются целые ядра, половинки и кусочки?", a: "Целые ядра не расколоты. Половинки (S) естественно раскалываются вдоль, ломаные (B) — поперёк, а кусочки калибруют по размеру: крупные белые (LWP), мелкие белые (SWP) и крошка (BB). Половинки и кусочки дешевле и подходят для выпечки, сладостей и снековых смесей." }
  - { q: "Какая влажность и срок хранения у ваших ядер кешью?", a: "Ядра сушат до влажности не выше 5% и упаковывают в вакуумные или заполненные азотом банки, которые сохраняют их около 12 месяцев в прохладном сухом месте." }
  - { q: "Как упаковывают ядра кешью?", a: "Стандартная экспортная упаковка — две вакуумные банки по 25 фунтов (22,68 кг) в коробке, 50 фунтов на коробку; 20-футовый контейнер вмещает около 700 коробок. Вакуумные гибкие пакеты по 10 кг и упаковка под собственной маркой — по запросу." }
  - { q: "Проверяют ли ядра кешью на афлатоксин?", a: "Да. Каждую партию перед отгрузкой проверяют в лаборатории на влажность и афлатоксин по нормам страны назначения, а независимую инспекцию можно организовать по запросу." }
