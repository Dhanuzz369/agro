originLine: "Карнатака, Тамилнад и Керала — несколько поставщиков кокосового волокна"
sourcingStory: "Кокосовый субстрат — мелкий губчатый материал, который остаётся после извлечения волокна из кокосовой скорлупы. Мы закупаем его у нескольких поставщиков в Карнатаке, Тамилнаде и Керале и выбираем поставщика для каждого заказа по формату, сорту и EC, которые нужны тепличному хозяйству. Каждую партию перед упаковкой проверяют в лаборатории на EC, pH и песок."
