  bricks-discs: { name: "Брикеты, диски и таблетки", description: "Брикеты по 650 г, диски и таблетки для рассады и садовой розницы под вашей маркой." }
  husk-chips: { name: "Кокосовые чипсы", description: "Калиброванные чипсы из кокосовой скорлупы для орхидей, томатов и перцев и для рыхлых смесей." }
faq:
  - { q: "Какие сорта кокосового субстрата по EC вы поставляете?", a: "Буферизованный — ниже 0,5 mS/cm, мытый — 0,5–1,0 mS/cm, сырой — от 1,5 mS/cm. Каждую партию проверяют на EC, pH и песок, а в контракте указывают метод измерения EC (например, 1:5 по EN 13038), потому что разные методы дают разные значения для одного и того же материала." }
  - { q: "Чем буферизованный субстрат отличается от мытого?", a: "Промывка удаляет большую часть солей натрия и калия. Буферизация идёт дальше: субстрат обрабатывают нитратом кальция, чтобы заменить натрий и калий, связанные с волокном, и субстрат не связывал кальций и магний, нужные растениям. Тепличные хозяйства с ягодами, томатами и огурцами обычно заказывают буферизованный субстрат." }
  - { q: "Насколько расширяется блок 5 кг?", a: "Блок 5 кг спрессован примерно 5:1 и после замачивания даёт 65–80 литров рыхлого субстрата." }
  - { q: "Какие форматы и варианты под собственной маркой вы предлагаете?", a: "GoodBiz Agri поставляет блоки 5 кг, мешки и маты для выращивания, смеси субстрата и чипсов 70:30 и 50:50, брикеты 650 г, диски, таблетки и кокосовые чипсы. Брикеты и мешки для розницы можно упаковать под вашей маркой." }
  - { q: "Какие документы сопровождают партию кокосового субстрата?", a: "Каждая партия идёт с фитосанитарным сертификатом индийской службы карантина растений, сертификатом происхождения и лабораторным анализом. Фумигацию проводит аккредитованная компания, если этого требует страна назначения, а некоторые страны добавляют свои условия, например паллеты ISPM-15." }
  - { q: "Можно ли ввозить кокосовый субстрат в ЕС и Великобританию?", a: "Да. Регламент ЕС 2019/2072, приложение VI, освобождает субстраты, полностью состоящие из неиспользованного кокосового волокна, от ограничений на почву и субстраты, и Великобритания применяет то же исключение. Каждая партия идёт с фитосанитарным сертификатом." }
