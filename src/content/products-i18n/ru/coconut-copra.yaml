faq:
  - { q: "Какой код HSN у копры?", a: "Кокосы и копра относятся к позиции HSN 0801. Мы уточняем точную 8-значную позицию для каждого продукта." }
  - { q: "Что такое шаровая копра Tiptur?", a: "Копра, высушенная целиком внутри скорлупы до года, со сладким белым ядром; ценится в странах Персидского залива и Южной Азии." }
  - { q: "Есть ли кокосы круглый год?", a: "Да. Поллачи поставляет кокосы в частично очищенной кожуре в течение всего года." }
