originLine: "Типтур, Тумакуру и Поллачи"
sourcingStory: "Типтур в округе Тумакуру славится шаровой копрой — целыми ядрами, медленно высушенными внутри скорлупы до сладкого белого результата. Мы закупаем её там же, копру для маслобоен — у трейдеров Тумакуру, а свежие кокосы в частично очищенной кожуре — на круглогодичном рынке Поллачи."
varieties:
