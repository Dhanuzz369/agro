name: "Арековый орех"
summary: "GoodBiz Agri экспортирует арековый орех (бетельный орех) — целый белый chali (чали), колотый, красный kempu (кемпу; сорта api и bette) и нарезанный — из Шивамогги и Дакшина-Каннады в Карнатаке и Касарагода в Керале."
originLine: "Шивамогга, Дакшина-Каннада и Касарагод"
sourcingStory: "Карнатака производит большую часть арекового ореха Индии. Прибрежные Дакшина-Каннада и Касарагод известны белым сушёным на солнце chali, который торгуется через кооперативный рынок Путтура, а область Малнад вокруг Шивамогги специализируется на варёных красных сортах."
varieties:
  whole-chali: { name: "Белый целый (chali)", description: "Целые орехи, высушенные на солнце, с белой сердцевиной." }
