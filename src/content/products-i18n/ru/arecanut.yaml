  sliced: { name: "Нарезанный арековый орех", description: "Ровные ломтики для рынков прямого потребления." }
faq:
  - { q: "Какой код HSN у арекового ореха?", a: "Арековый орех относится к позиции HSN 0802 80. Мы уточняем точную 8-значную позицию для каждого сорта; запросите у нас код для импортных документов." }
  - { q: "Чем отличается chali от kempu?", a: "Chali — целый орех, высушенный на солнце, из прибрежной Карнатаки; kempu варят и сушат, отчего он приобретает красный цвет." }
  - { q: "Когда собирают арековый орех?", a: "С ноября по март; пик поступления нового урожая приходится на январь." }
