reviewStatus: pending
name: "Куркума"
summary: "GoodBiz Agri экспортирует свежую куркуму (HSN 09103010), сушёные пальцы и луковицы куркумы (HSN 09103020) и молотую куркуму (HSN 09103030) из Эроде и Салема в Тамилнаде и Аллеппи в Керале, с содержанием куркумина от 2% до 5% и влажностью менее 10%."
originLine: "Эроде, Салем и Аллеппи — сердце куркумы в Индии"
sourcingStory: "Регулируемый рынок Эроде определяет цену значительной части мировой куркумы. Полированные пальцы и луковицы мы закупаем там и в Салеме после каждого урожая, а куркуму Alleppey (Аллеппи) с высоким содержанием куркумина — у трейдеров Керале для покупателей, которым важна красящая сила. Порошок мелется под заказ, чтобы куркумин и помол соответствовали вашей спецификации."
varieties:
  fresh: { name: "Свежая куркума", description: "Вымытые, просушенные на воздухе корневища в вентилируемых коробках, перевозка в рефрижераторе." }
  dried-finger: { name: "Сушёные пальцы Erode", description: "Варёные, высушенные на солнце и полированные пальцы с содержанием куркумина 2,5–3,5%." }
  alleppey-finger: { name: "Пальцы Alleppey", description: "Керальская куркума с высоким содержанием куркумина, востребована для экстракции и окрашивания." }
  salem-bulb: { name: "Луковицы Salem", description: "Круглые луковицы из Салема, популярны для помола." }
  powder: { name: "Молотая куркума", description: "Помол под заказ, 60–80 меш, куркумин от 2 до 5%." }
faq:
  - { q: "Какой код HSN у молотой куркумы?", a: "Молотая куркума классифицируется по HSN 09103030. Сушёная цельная куркума — 09103020, свежая — 09103010." }
  - { q: "Какое содержание куркумина вы можете поставить?", a: "Куркума Erode и Salem обычно показывает 2,5–4% куркумина; пальцы Alleppey — 4,5–5%. Порошок можно купажировать до заданного уровня куркумина." }
  - { q: "Каков минимальный заказ для куркумы?", a: "Один 20-футовый контейнер: около 18–19 тонн сушёной куркумы или 20 тонн порошка." }
  - { q: "Когда собирают куркуму?", a: "Основной сбор идёт с января по апрель; свежая куркума поступает на рынок Эроде с февраля." }
  - { q: "Можете ли вы соблюсти нормы ЕС по пестицидам?", a: "Да. Мы закупаем партии и проверяем их по MRL ЕС, а перед отгрузкой можем предоставить анализ независимой лабораторией." }
