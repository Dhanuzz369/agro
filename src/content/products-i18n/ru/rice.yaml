name: "Рис из Южной Индии"
summary: "GoodBiz Agri экспортирует специальные сорта риса из Южной Индии — Sona Masoori (Сона Масури; сырой и пропаренный), Ponni (Понни), Kerala Matta (Керала Матта), Seeraga Samba (Сирага Самба) и рис для идли — переработанные на заводах Райчура, Мандьи, Танджавура и Палаккада."
originLine: "Заводы Райчура, Мандьи, Танджавура и Палаккада"
sourcingStory: "Рис Южной Индии легче и разнообразнее длиннозёрных сортов, привычных большинству покупателей. Sona Masoori мы закупаем в зоне орошения Тунгабхадры вокруг Райчура, Ponni и Seeraga Samba — на заводах дельты Кавери в Танджавуре, а Matta — в Палаккаде, подбирая каждую партию под блюдо и рынок, для которых она предназначена."
varieties:
  sona-masoori-raw: { name: "Sona Masoori (сырой)", description: "Лёгкий среднезёрный рис, повседневный основной продукт южноиндийской кухни." }
  sona-masoori-steam: { name: "Sona Masoori (пропаренный)", description: "Пропаривается перед шлифовкой: зёрна плотнее, срок хранения дольше." }
  ponni: { name: "Ponni", description: "Мягкий среднезёрный рис из Тамилнада, предпочитаемый в Юго-Восточной Азии и странах Персидского залива." }
  kerala-matta: { name: "Kerala Matta", description: "Пропаренный рис с красными отрубями из Палаккада с ореховым вкусом." }
  seeraga-samba: { name: "Seeraga Samba", description: "Мелкое ароматное зерно, из которого в Тамилнаде готовят бирьяни." }
  idli-rice: { name: "Рис для идли", description: "Короткий крупный пропаренный рис для теста идли и доса." }
faq:
  - { q: "Чем отличается сырой Sona Masoori от пропаренного?", a: "Пропаренный рис слегка обрабатывается паром перед шлифовкой, поэтому после варки зёрна плотнее, а срок хранения больше." }
  - { q: "Можете ли вы поставлять розничную фасовку под нашей маркой?", a: "Да, в мешках BOPP или джутовых по 5, 10 и 25 кг с вашим брендингом." }
