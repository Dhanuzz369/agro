name: "Джаггери"
summary: "GoodBiz Agri экспортирует джаггери (необработанный тростниковый сахар) — блоки, кубики, порошок, органический джаггери и пальмовый джаггери (karupatti, карупатти) — из Мандьи и Белагави в Карнатаке и Тхутхукуди в Тамилнаде."
originLine: "Мандья, Белагави и Тхутхукуди"
sourcingStory: "Сахарно-тростниковый пояс Мандьи производит джаггери поколениями, уваривая свежий тростниковый сок в открытых чанах. Блоки и органический джаггери мы закупаем там, кубики и порошок — у переработчиков Белагави, а пальмовый джаггери — у сборщиков сока пальмиры в Тхутхукуди."
varieties:
  block: { name: "Блоки джаггери", description: "Традиционные формованные блоки, от золотистого до тёмно-коричневого цвета." }
  cube: { name: "Кубики джаггери", description: "Небольшие кубики для розницы и общепита." }
  powder: { name: "Порошок джаггери", description: "Сыпучие гранулы для пекарен и напитков." }
  organic: { name: "Органический джаггери", description: "Производится без химического осветления." }
  palm-karupatti: { name: "Пальмовый джаггери (karupatti)", description: "Из сока пальмиры на юге Тамилнада." }
faq:
  - { q: "Как долго хранится джаггери?", a: "Около 12 месяцев в прохладном сухом месте; лучше всего хранятся порошок и блоки в вакуумной упаковке." }
  - { q: "Можете ли вы поставлять продукцию под нашей маркой?", a: "Да, в упаковках от 500 г до 5 кг с вашим брендингом." }
