name: "Jengibre"
summary: "GoodBiz Agri exporta jengibre seco (sin blanquear y blanqueado), otros jengibres secos enteros y jengibre fresco de Wayanad en Kerala y Kodagu y Hassan en Karnataka, enviados desde Kochi, New Mangalore y Chennai; el fresco, en contenedor refrigerado."
originLine: "Wayanad, Kodagu y Hassan — el cinturón del jengibre de los Ghats Occidentales"
sourcingStory: "El jengibre cultivado en las laderas de los Ghats Occidentales es conocido por su pungencia y su contenido de aceite. Compramos jengibre fresco a los productores de Wayanad durante la cosecha y jengibre seco a través del comercio de especias de Kochi, donde la calidad «Cochin ginger» se comercializa desde hace siglos."
varieties:
  fresh: { name: "Jengibre fresco", description: "Rizomas lavados y secados al aire, envasados en cajas de cartón o sacos de malla para envío en contenedor refrigerado." }
  dried-unbleached: { name: "Jengibre seco sin blanquear", description: "Jengibre pelado y secado al sol, de color natural." }
  dried-bleached: { name: "Jengibre seco blanqueado", description: "Blanqueado con cal para un aspecto pálido y uniforme." }
  whole-other: { name: "Jengibre seco entero (otro)", description: "Jengibre entero, ni triturado ni molido, según la calidad del comprador." }
faq:
  - { q: "¿Cómo se envía el jengibre fresco?", a: "El jengibre fresco viaja en contenedores refrigerados de 40 pies a unos 12–13 °C, con unas 26 toneladas por contenedor." }
  - { q: "¿Desde qué puertos envían el jengibre?", a: "GoodBiz Agri envía jengibre seco y fresco desde Kochi, New Mangalore y Chennai en condiciones FOB, CFR o CIF." }
