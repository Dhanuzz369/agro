name: "Maní"
summary: "GoodBiz Agri exporta maní pelado (cacahuate) — bold runner, Java y blanqueado de 38/42 a 80/90 granos por onza — de Chitradurga, Anantapur y Tiruvannamalai, enviado desde el puerto indio que mejor convenga a cada pedido con análisis de aflatoxinas a pedido."
