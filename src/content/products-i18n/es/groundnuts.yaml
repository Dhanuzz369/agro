reviewStatus: pending
name: "Maní"
summary: "GoodBiz Agri exporta maní pelado (cacahuate) — bold runner, Java y blanqueado, en calibres de 38/42 a 80/90 — procedente de Chitradurga, en Karnataka, Anantapur, en Andhra Pradesh, y Tiruvannamalai, en Tamil Nadu."
originLine: "Chitradurga, Anantapur y Tiruvannamalai"
sourcingStory: "La árida meseta del Decán, alrededor de Anantapur y Chitradurga, es una de las mayores regiones productoras de maní de la India. Compramos los granos después de la cosecha, los clasificamos por calibre y los analizamos para aflatoxina antes de envasarlos."
varieties:
  bold-runner: { name: "Bold (runner)", description: "Granos grandes y alargados para tostado y snacks." }
  java: { name: "Java (Spanish)", description: "Granos redondos y de alto contenido de aceite para confitería y molienda." }
  blanched: { name: "Blanqueado", description: "Sin piel, entero o partido, con bajo contenido de aflatoxina." }
faq:
  - { q: "¿Pueden cumplir los límites de aflatoxina de la UE?", a: "Sí, con lotes seleccionados y análisis de terceros hasta ≤ 4 ppb de aflatoxina total, a solicitud." }
  - { q: "¿Qué calibres hay disponibles?", a: "De 38/42 a 80/90 granos por onza, según la variedad." }
