reviewStatus: pending
name: "Arroz del sur de la India"
summary: "GoodBiz Agri exporta arroces especiales del sur de la India bajo el HSN 1006 — Sona Masoori (crudo y al vapor), Ponni, Kerala Matta, Seeraga Samba y arroz para idli — molidos en Raichur, Mandya, Thanjavur y Palakkad."
originLine: "Molinos de Raichur, Mandya, Thanjavur y Palakkad"
sourcingStory: "El arroz del sur de la India es más ligero y variado que los tipos de grano largo que conocen la mayoría de los compradores. Compramos Sona Masoori en la zona de riego del Tungabhadra, cerca de Raichur; Ponni y Seeraga Samba en los molinos del delta del Kaveri, en Thanjavur; y Matta en Palakkad, adaptando cada lote al plato y al mercado a los que se destina."
varieties:
  sona-masoori-raw: { name: "Sona Masoori (crudo)", description: "Arroz ligero de grano medio, el alimento básico cotidiano de las cocinas del sur de la India." }
  sona-masoori-steam: { name: "Sona Masoori (al vapor)", description: "Tratado al vapor antes de la molienda para granos más firmes y mayor vida útil." }
  ponni: { name: "Ponni", description: "Arroz suave de grano medio de Tamil Nadu, preferido en el Sudeste Asiático y el Golfo." }
  kerala-matta: { name: "Kerala Matta", description: "Arroz parboiled de salvado rojo de Palakkad, con sabor a nuez." }
  seeraga-samba: { name: "Seeraga Samba", description: "Grano pequeño y aromático que se usa para el biryani en Tamil Nadu." }
  idli-rice: { name: "Arroz para idli", description: "Arroz parboiled de grano corto y grueso para la masa de idli y dosa." }
faq:
  - { q: "¿Cuál es el código HSN del arroz Sona Masoori?", a: "El arroz se clasifica en el HSN 1006; el arroz no basmati molido, como el Sona Masoori, suele declararse en las subpartidas 10063090. Confirme la línea de 8 dígitos con su agente." }
  - { q: "¿Cuál es la diferencia entre Sona Masoori crudo y al vapor?", a: "El arroz al vapor se trata ligeramente con vapor antes de la molienda, lo que da granos cocidos más firmes y mayor duración en almacenamiento." }
  - { q: "¿Pueden suministrar bolsas minoristas de marca propia?", a: "Sí, en bolsas de BOPP o yute de 5, 10 y 25 kg con su marca." }
  - { q: "¿Cuál es el pedido mínimo?", a: "Un contenedor de 20 pies, de unas 25–26 toneladas." }
