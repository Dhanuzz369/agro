  edible-cups: { name: "Copas de copra comestibles", description: "Medias copas para uso alimentario." }
faq:
  - { q: "¿Qué es la copra en bola de Tiptur?", a: "Copra secada entera dentro de la cáscara hasta por un año, que da una almendra dulce y blanca muy apreciada en el Golfo y el sur de Asia." }
  - { q: "¿Hay cocos disponibles todo el año?", a: "Sí. Pollachi suministra cocos semidescascarados durante todo el año." }
  - { q: "¿Desde qué puertos envían la copra y el coco?", a: "GoodBiz Agri envía copra en bola, copra para molienda y coco semipelado desde el puerto indio que mejor convenga a cada pedido en condiciones FOB, CFR o CIF." }
