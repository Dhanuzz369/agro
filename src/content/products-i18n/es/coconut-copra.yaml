name: "Coco y copra"
summary: "GoodBiz Agri exporta coco semipelado y copra — copra en bola de Tiptur, copra para molienda y copas comestibles — de Tiptur y Tumakuru en Karnataka y Pollachi en Tamil Nadu, enviados desde el puerto indio que mejor convenga a cada pedido al Golfo, el sur de Asia y otros mercados."
originLine: "Tiptur, Tumakuru y Pollachi"
sourcingStory: "Tiptur, en el distrito de Tumakuru, es famosa por la copra en bola: el endospermo entero secado lentamente dentro de la cáscara, con un resultado dulce y blanco. La compramos allí; la copra para molienda, a comerciantes de Tumakuru, y los cocos frescos semidescascarados, en el mercado de Pollachi, activo todo el año."
