name: "Cúrcuma"
summary: "GoodBiz Agri exporta cúrcuma — fresca, dedos secos de Erode, bulbos de Salem, dedos de Alleppey altos en curcumina y cúrcuma en polvo — de Erode y Salem en Tamil Nadu y Alappuzha en Kerala, enviada desde el puerto indio que mejor convenga a cada pedido, con 2–5 % de curcumina y humedad inferior al 10 %."
originLine: "Erode, Salem y Alleppey — el corazón de la cúrcuma de la India"
sourcingStory: "El mercado regulado de Erode fija el precio de gran parte de la cúrcuma del mundo. Allí y en Salem compramos dedos y bulbos pulidos en cada cosecha, y adquirimos de comerciantes de Kerala dedo Alleppey de alta curcumina para los compradores que necesitan intensidad de color. El polvo se muele por encargo para que la curcumina y la malla se ajusten a su especificación."
varieties:
  fresh: { name: "Cúrcuma fresca", description: "Rizomas lavados y secados al aire, enviados en cajas ventiladas en contenedor refrigerado." }
  dried-finger: { name: "Dedo seco de Erode", description: "Dedos hervidos, secados al sol y pulidos, con 2,5–3,5% de curcumina." }
  alleppey-finger: { name: "Dedo Alleppey", description: "Cúrcuma de Kerala de alta curcumina, preferida para extracción y color." }
  salem-bulb: { name: "Bulbo de Salem", description: "Bulbos redondos de Salem, populares para molienda." }
  powder: { name: "Cúrcuma en polvo", description: "Molida por encargo, malla 60–80, curcumina graduada del 2–5%." }
faq:
  - { q: "¿Qué niveles de curcumina pueden suministrar?", a: "La cúrcuma de Erode y Salem suele dar entre 2,5 y 4% de curcumina; el dedo Alleppey, entre 4,5 y 5%. El polvo puede mezclarse hasta un nivel de curcumina especificado." }
  - { q: "¿Pueden cumplir los límites de plaguicidas de la UE?", a: "Sí. Adquirimos y analizamos los lotes según los LMR de la UE y podemos facilitar análisis de terceros antes del embarque." }
  - { q: "¿Desde qué puertos envían la cúrcuma?", a: "GoodBiz Agri envía cúrcuma en dedos, bulbos y polvo desde el puerto indio que mejor convenga a cada pedido en condiciones FOB, CFR o CIF." }
seo:
