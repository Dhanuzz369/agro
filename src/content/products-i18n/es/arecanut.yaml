faq:
  - { q: "¿Cuál es la diferencia entre chali y kempu?", a: "La chali es nuez de areca madura secada al sol con su cáscara en la costa de Karnataka y queda blanca; la kempu es nuez tierna pelada, hervida y secada, lo que le da color rojo." }
  - { q: "¿Desde qué puertos envían la nuez de areca?", a: "GoodBiz Agri envía nuez de areca (betel) desde New Mangalore y Chennai en condiciones FOB, CFR o CIF." }
