  organic: { name: "جاغري عضوي", description: "يُصنع دون تنقية كيميائية." }
  palm-karupatti: { name: "جاغري النخيل (karupatti)", description: "يُصنع من عصارة نخيل البالميرا في جنوب تاميل نادو." }
faq:
  - { q: "كم تدوم صلاحية الجاغري؟", a: "نحو 12 شهرًا في مكان بارد وجاف؛ ويحتفظ المسحوق والقوالب المعبأة تحت التفريغ بجودتها أفضل." }
  - { q: "هل يمكنكم التوريد بعلامة خاصة؟", a: "نعم، في عبوات من 500 جم إلى 5 كجم بعلامتكم التجارية." }
