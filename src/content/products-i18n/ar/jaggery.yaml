name: "الجاغري"
summary: "تُصدّر GoodBiz Agri الجاغري (jaggery، «جاغري»، سكر القصب غير المكرر) — قوالب ومكعبات ومسحوق وجاغري عضوي وجاغري النخيل (karupatti، «كاروباتي») — من مانديا وبيلاغافي في كارناتاكا وثوتوكودي في تاميل نادو."
originLine: "مانديا وبيلاغافي وثوتوكودي"
sourcingStory: "تصنع منطقة قصب السكر في مانديا الجاغري منذ أجيال، بغلي عصير القصب الطازج في أوانٍ مفتوحة. نشتري هناك القوالب والجاغري العضوي، والمكعبات والمسحوق من معالجي بيلاغافي، وجاغري النخيل من جامعي عصارة نخيل البالميرا في ثوتوكودي."
varieties:
