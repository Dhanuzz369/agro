reviewStatus: pending
name: "الكركم"
summary: "تُصدّر GoodBiz Agri الكركم الطازج، وأصابع وكُتَل الكركم المجفف، ومسحوق الكركم من إيرود (Erode، «إيرود») وسالم (Salem) في تاميل نادو وألابوزا (Alappuzha، «ألّيبّي/Alleppey») في كيرالا، بنسبة كركمين من 2% إلى 5% ورطوبة أقل من 10%."
originLine: "إيرود وسالم وألّيبّي — قلب الكركم في الهند"
sourcingStory: "يحدد سوق إيرود المنظَّم سعر جزء كبير من كركم العالم. نشتري هناك وفي سالم أصابع وكُتَل مصقولة في كل موسم حصاد، ونورّد أصابع ألّيبّي عالية الكركمين من تجار كيرالا للمشترين الذين يحتاجون إلى قوة لون. يُطحن المسحوق حسب الطلب لتتوافق نسبة الكركمين ودرجة النعومة مع مواصفاتكم."
varieties:
  fresh: { name: "كركم طازج", description: "جذامير مغسولة ومجففة بالهواء تُشحن في كرتون مهوّى بحاويات مبرّدة." }
  dried-finger: { name: "أصابع إيرود المجففة", description: "أصابع مسلوقة ومجففة بالشمس ومصقولة بنسبة كركمين 2.5–3.5%." }
  alleppey-finger: { name: "أصابع ألّيبّي", description: "كركم كيرالا عالي الكركمين، مفضَّل للاستخلاص والتلوين." }
  salem-bulb: { name: "كُتَل سالم", description: "كُتَل مستديرة من سالم، رائجة للطحن." }
  powder: { name: "مسحوق الكركم", description: "يُطحن حسب الطلب، 60–80 mesh، بنسبة كركمين متدرجة من 2 إلى 5%." }
faq:
  - { q: "ما مستويات الكركمين التي يمكنكم توريدها؟", a: "يتراوح الكركمين في كركم إيرود وسالم عادةً بين 2.5 و4%؛ وفي أصابع ألّيبّي بين 4.5 و5%. ويمكن مزج المسحوق للوصول إلى نسبة كركمين محددة." }
  - { q: "هل يمكنكم الالتزام بحدود المبيدات الأوروبية؟", a: "نعم. نشتري الشحنات ونفحصها وفق الحدود القصوى للمتبقيات (MRL) في الاتحاد الأوروبي، ويمكننا تقديم تحليل من طرف ثالث قبل الشحن." }
