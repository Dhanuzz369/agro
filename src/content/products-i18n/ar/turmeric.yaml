name: "الكركم"
summary: "تُصدّر GoodBiz Agri الكركم — طازجاً وأصابع إيرود المجففة وبصيلات سالم وأصابع أليبي عالية الكركمين ومسحوق الكركم — من إيرود وسالم بولاية تاميل نادو وألابوزا بولاية كيرالا، وتشحنه من تشيناي وتوتيكورين وكوتشي بنسبة كركمين 2–5% ورطوبة أقل من 10%."
originLine: "إيرود وسالم وألّيبّي — قلب الكركم في الهند"
sourcingStory: "يحدد سوق إيرود المنظَّم سعر جزء كبير من كركم العالم. نشتري هناك وفي سالم أصابع وكُتَل مصقولة في كل موسم حصاد، ونورّد أصابع ألّيبّي عالية الكركمين من تجار كيرالا للمشترين الذين يحتاجون إلى قوة لون. يُطحن المسحوق حسب الطلب لتتوافق نسبة الكركمين ودرجة النعومة مع مواصفاتكم."
varieties:
  fresh: { name: "كركم طازج", description: "جذامير مغسولة ومجففة بالهواء تُشحن في كرتون مهوّى بحاويات مبرّدة." }
  dried-finger: { name: "أصابع إيرود المجففة", description: "أصابع مسلوقة ومجففة بالشمس ومصقولة بنسبة كركمين 2.5–3.5%." }
  alleppey-finger: { name: "أصابع ألّيبّي", description: "كركم كيرالا عالي الكركمين، مفضَّل للاستخلاص والتلوين." }
