faq:
  - { q: "ما رمز HSN للكوبرا؟", a: "يندرج جوز الهند والكوبرا تحت البند HSN 0801. نعمل على تأكيد البند الدقيق المكوّن من 8 أرقام لكل منتج." }
  - { q: "ما هي كوبرا تيبتور الكروية؟", a: "كوبرا تُجفف كاملة داخل القشرة لمدة تصل إلى عام، فتعطي لبًّا أبيض حلو المذاق يحظى بتقدير كبير في الخليج وجنوب آسيا." }
  - { q: "هل جوز الهند متوفر طوال العام؟", a: "نعم. توفّر بولاتشي جوز الهند نصف المقشَّر على مدار السنة." }
