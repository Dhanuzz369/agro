name: "جوز الهند والكوبرا"
summary: "تُصدّر GoodBiz Agri جوز الهند نصف المقشَّر والكوبرا (kobre، «كوبري») — كوبرا تيبتور الكروية (Tiptur ball copra، «تيبتور»)، وكوبرا العصر، وأكواب الكوبرا الصالحة للأكل — من تيبتور وتوماكورو في كارناتاكا وبولاتشي في تاميل نادو."
originLine: "تيبتور وتوماكورو وبولاتشي"
sourcingStory: "تشتهر تيبتور في منطقة توماكورو بالكوبرا الكروية — ثمار كاملة تُجفف ببطء داخل القشرة لتعطي لبًّا أبيض حلو المذاق. نشتريها هناك، ونشتري كوبرا العصر من تجار توماكورو، وجوز الهند الطازج نصف المقشَّر من سوق بولاتشي النشط طوال العام."
