name: "الفول السوداني"
summary: "تُصدّر GoodBiz Agri الفول السوداني المقشور (peanuts) — بولد رانر (bold runner)، وجاوا (Java)، والمُزال القشرة (blanched) — بأعداد من 38/42 إلى 80/90، من تشيترادورغا في كارناتاكا وأنانتابور في أندرا براديش وتيروفانامالاي في تاميل نادو."
originLine: "تشيترادورغا وأنانتابور وتيروفانامالاي"
sourcingStory: "تُعدّ هضبة الديكان الجافة حول أنانتابور وتشيترادورغا من أكبر مناطق زراعة الفول السوداني في الهند. نشتري الحبوب بعد الحصاد، ونفرزها حسب العدد، ونفحصها للأفلاتوكسين قبل التعبئة."
