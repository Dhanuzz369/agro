name: "حبات الكاجو"
summary: "تُصدّر GoodBiz Agri حبات الكاجو المعالجة — الكاملة W180 وW210 وW240 وW320 وW450، والكاملة المحمّصة، والأنصاف والمكسورة والقطع (LWP وSWP وBB) — من معالجين في كيرالا وكارناتاكا وتاميل نادو، معبأة تحت التفريغ ومفحوصة مخبرياً للرطوبة والأفلاتوكسين."
originLine: "كيرالا وكارناتاكا وتاميل نادو — عدة معالجين"
sourcingStory: "تصلنا حبات الكاجو مقشورة ومنزوعة القشرة الرقيقة ومصنّفة. نشتريها من عدة معالجين في كيرالا وكارناتاكا وتاميل نادو، ونختار المعالج لكل طلب بحسب الدرجة واللون والكمية التي يحتاجها المشتري. تُفحص كل دفعة مخبرياً للرطوبة والأفلاتوكسين ثم تُعبأ تحت التفريغ في علب أو أكياس مرنة."
varieties:
  white-wholes: { name: "حبات كاملة بيضاء (W180–W450)", description: "حبات كاملة بيضاء مصنّفة بعدد الحبات في الرطل، من W180 الكبيرة إلى W450 الصغيرة؛ وW320 هي الدرجة الأكثر تداولاً." }
  scorched-wholes: { name: "حبات كاملة محمّصة (SW)", description: "حبات كاملة بلون بني فاتح بسبب تحميص أطول داخل القشرة، بسعر أقل من الكاملة البيضاء." }
  splits-butts: { name: "أنصاف ومكسورة (S وB)", description: "حبات منشقة طولياً (S) أو مكسورة عرضياً (B) للحلويات والمخبوزات." }
  pieces: { name: "قطع الكاجو (LWP وSWP وBB)", description: "قطع بيضاء كبيرة وقطع بيضاء صغيرة وفتات للوجبات الخفيفة والحلويات والمكونات." }
faq:
  - { q: "ماذا تعني درجات الكاجو W180 وW240 وW320؟", a: "يرمز W إلى الحبات الكاملة البيضاء، والرقم هو عدد الحبات في الرطل. في W180 من 170 إلى 180 حبة في الرطل، فالحبات كبيرة؛ وفي W320 من 300 إلى 320؛ وفي W450 من 400 إلى 450، وهي أصغر درجة كاملة. وW320 هي الدرجة الأكثر تداولاً." }
  - { q: "ما الفرق بين الحبات الكاملة والأنصاف والقطع؟", a: "الحبات الكاملة غير مكسورة. الأنصاف (S) تنشق طبيعياً على طولها، والمكسورة (B) تنكسر عرضياً، أما القطع فتُصنّف بحسب الحجم إلى قطع بيضاء كبيرة (LWP) وصغيرة (SWP) وفتات (BB). الأنصاف والقطع أرخص وتناسب المخبوزات والحلويات وخلطات الوجبات الخفيفة." }
  - { q: "ما نسبة الرطوبة ومدة الصلاحية لحبات الكاجو لديكم؟", a: "تُجفف الحبات إلى رطوبة 5% أو أقل وتُعبأ في علب مفرغة من الهواء أو معبأة بالنيتروجين تحفظها نحو 12 شهراً في مكان بارد وجاف." }
  - { q: "كيف تُعبأ حبات الكاجو؟", a: "العبوة التصديرية القياسية علبتان مفرغتان من الهواء وزن كل منهما 25 رطلاً (22.68 كغ) في كرتونة، أي 50 رطلاً للكرتونة؛ وتتسع حاوية 20 قدماً لنحو 700 كرتونة. وتتوفر أكياس مرنة مفرغة 10 كغ وتعبئة بعلامة خاصة عند الطلب." }
  - { q: "هل تُفحص حبات الكاجو للأفلاتوكسين؟", a: "نعم. تُفحص كل دفعة مخبرياً للرطوبة والأفلاتوكسين قبل الشحن وفق حد سوق الوجهة، ويمكن ترتيب فحص من جهة ثالثة عند الطلب." }
