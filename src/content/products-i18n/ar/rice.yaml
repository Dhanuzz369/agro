name: "أرز جنوب الهند"
summary: "تُصدّر GoodBiz Agri أرز جنوب الهند — سونا مسوري (خام ومبخّر) وبوني وكيرالا ماتا وسيراغا سامبا وأرز الإدلي — المطحون في رايشور وماندايا وثانجافور وبالاكاد، وتشحنه من الميناء الهندي الأنسب لكل طلب إلى المستوردين في أكثر من 70 دولة."
originLine: "مطاحن رايتشور ومانديا وثانجافور وبالاكاد"
sourcingStory: "أرز جنوب الهند أخف وأكثر تنوعًا من الأرز طويل الحبة الذي يعرفه معظم المشترين. نشتري Sona Masoori من منطقة ري تونغابهادرا حول رايتشور، وPonni وSeeraga Samba من مطاحن دلتا كافيري في ثانجافور، وMatta من بالاكاد، ونُطابق كل شحنة مع الطبق والسوق المخصصة له."
