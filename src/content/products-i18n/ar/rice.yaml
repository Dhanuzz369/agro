faq:
  - { q: "ما رمز HSN لأرز Sona Masoori؟", a: "يندرج الأرز تحت رمز HSN 1006؛ ويُصرَّح عادةً عن الأرز المطحون غير البسمتي مثل Sona Masoori ضمن البنود الفرعية 10063090. تأكد من البند المكوّن من 8 أرقام مع مخلّصك الجمركي." }
  - { q: "ما الفرق بين Sona Masoori الخام والمُبخَّر؟", a: "الأرز المُبخَّر يُعالَج بالبخار برفق قبل الطحن، فيعطي حبوبًا مطبوخة أكثر تماسكًا وعمر تخزين أطول." }
  - { q: "هل يمكنكم توريد أكياس تجزئة بعلامة خاصة؟", a: "نعم، في أكياس BOPP أو الجوت بوزن 5 و10 و25 كجم بعلامتكم التجارية." }
  - { q: "ما الحد الأدنى للطلب؟", a: "حاوية واحدة بطول 20 قدمًا، أي نحو 25–26 طنًا." }
