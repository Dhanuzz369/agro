name: "الزنجبيل"
summary: "تُصدّر GoodBiz Agri الزنجبيل الطازج (رمز HSN 09101110)، والزنجبيل المجفف غير المبيَّض (09101120)، والزنجبيل المجفف المبيَّض (09101130)، وأنواع الزنجبيل الكامل الأخرى (09101190) من وايناد في كيرالا وكوداغو وهاسان في كارناتاكا."
originLine: "وايناد وكوداغو وهاسان — حزام الزنجبيل في الغات الغربية"
sourcingStory: "يشتهر الزنجبيل المزروع على سفوح الغات الغربية بحدّته ومحتواه من الزيت. نشتري الزنجبيل الطازج من مزارعي وايناد خلال الحصاد، والمجفف عبر تجارة التوابل في كوتشي، حيث تُتداول درجة «زنجبيل كوشين» منذ قرون."
