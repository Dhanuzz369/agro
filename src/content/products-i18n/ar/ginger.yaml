faq:
  - { q: "ما رمز HSN للزنجبيل المجفف؟", a: "الزنجبيل المجفف غير المبيَّض رمزه HSN 09101120 والمجفف المبيَّض 09101130. أما الطازج فرمزه 09101110." }
  - { q: "كيف يُشحن الزنجبيل الطازج؟", a: "في حاويات مبرّدة بطول 40 قدمًا عند نحو 12–13 °م، بسعة تقارب 26 طنًا." }
  - { q: "متى يُحصد الزنجبيل؟", a: "من ديسمبر إلى مارس. ويتوفر المجفف طوال العام من المخزون." }
  - { q: "ما الحد الأدنى للطلب؟", a: "حاوية واحدة بطول 20 قدمًا للزنجبيل المجفف، أو حاوية مبرّدة واحدة بطول 40 قدمًا للطازج." }
