summary: "تُصدّر GoodBiz Agri الزنجبيل المجفف (غير المُبيَّض والمُبيَّض) وغيره من الزنجبيل المجفف الكامل والزنجبيل الطازج من وايناد بولاية كيرالا وكوداغو وهاسان بولاية كارناتاكا، وتشحنه من الميناء الهندي الأنسب لكل طلب — والطازج بحاويات مبردة."
