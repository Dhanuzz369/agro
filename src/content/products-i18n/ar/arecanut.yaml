faq:
  - { q: "ما رمز HSN لجوز الأريكا؟", a: "يندرج جوز الأريكا تحت البند HSN 0802 80. نعمل على تأكيد البند الدقيق المكوّن من 8 أرقام لكل درجة؛ اسألنا عن الرمز الذي يُستخدم في مستندات الاستيراد لديكم." }
  - { q: "ما الفرق بين chali وkempu؟", a: "التشالي ثمرة كاملة مجففة بالشمس من ساحل كارناتاكا؛ أما الكيمبو فمسلوق ثم مجفف، ما يمنحه لونه الأحمر." }
  - { q: "متى يُحصد جوز الأريكا؟", a: "من نوفمبر إلى مارس، وتبلغ وصولات المحصول الجديد ذروتها في يناير." }
