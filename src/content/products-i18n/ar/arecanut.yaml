name: "جوز الأريكا"
summary: "تُصدّر GoodBiz Agri جوز الأريكا (جوز التنبول) — تشالي (chali، «تشالي») الأبيض الكامل، والمشقوق، وكيمبو (kempu، «كيمبو») الأحمر بدرجتَي api («أبي») وbette («بيتّي»)، والمقطّع شرائح — من شيفاموغا وداكشينا كانادا في كارناتاكا وكاساراغود في كيرالا."
originLine: "شيفاموغا وداكشينا كانادا وكاساراغود"
sourcingStory: "تنتج كارناتاكا معظم جوز الأريكا في الهند. تشتهر منطقتا داكشينا كانادا الساحلية وكاساراغود بالتشالي الأبيض المجفف بالشمس الذي يُتداول عبر سوق بوتّور التعاونية، بينما تتخصص منطقة مالناد في شيفاموغا في الدرجات الحمراء المسلوقة."
