name: "الأرز غير البسمتي"
summary: "تُصدّر GoodBiz Agri الأرز غير البسمتي بالجملة — IR64 خام ومسلوق وسوارنا وIR36 بنسب كسر 5% و25% — من مطاحن دلتا غودافاري ونيلور ورايشور، وتشحنه من الميناء الهندي الأنسب لكل طلب إلى أفريقيا وآسيا والشرق الأوسط."
originLine: "مطاحن دلتا غوداوري ونيلور ورايتشور"
sourcingStory: "تُعدّ دلتا غوداوري ومنطقة نيلور في أندرا براديش من أكبر سلال الأرز في الهند. نتعاقد مع مطاحن مزودة بأجهزة الفرز الضوئي (سورتكس) للحصول على IR64 وSwarna بجودة ثابتة وبدرجات الكسر التي يحددها المستوردون الأفارقة والآسيويون."
varieties:
