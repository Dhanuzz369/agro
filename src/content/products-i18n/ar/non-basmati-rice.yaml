name: "الأرز غير البسمتي"
summary: "تُصدّر GoodBiz Agri الأرز غير البسمتي بكميات كبيرة ضمن رمز HSN 10063099 — IR64 (آي آر 64) خام ومسلوق، وSwarna («سوارنا») وIR36 (آي آر 36) بدرجتَي كسر 5% و25% — من مطاحن دلتا غوداوري ونيلور ورايتشور."
originLine: "مطاحن دلتا غوداوري ونيلور ورايتشور"
sourcingStory: "تُعدّ دلتا غوداوري ومنطقة نيلور في أندرا براديش من أكبر سلال الأرز في الهند. نتعاقد مع مطاحن مزودة بأجهزة الفرز الضوئي (سورتكس) للحصول على IR64 وSwarna بجودة ثابتة وبدرجات الكسر التي يحددها المستوردون الأفارقة والآسيويون."
varieties:
  ir64-raw: { name: "IR64 خام", description: "أرز أبيض طويل الحبة بدرجتَي كسر 5% و25%." }
  ir64-parboiled: { name: "IR64 مسلوق", description: "مسلوق لزيادة المردود وتماسك الحبوب، ومطلوب في غرب أفريقيا." }
  swarna: { name: "Swarna", description: "أرز متوسط الحبة من أندرا براديش، يُستخدم على نطاق واسع في بنغلاديش وأفريقيا." }
  ir36: { name: "IR36", description: "أرز أبيض طويل الحبة للأسواق الحساسة للسعر." }
faq:
  - { q: "ماذا يشمل رمز HSN 10063099؟", a: "يشمل الأرز غير البسمتي نصف المبيَّض أو المبيَّض كليًا غير المذكور في موضع آخر." }
  - { q: "ما نسب الكسر التي توفرونها؟", a: "5% و25% كسر كمعيار؛ و10% و15% عند الطلب." }
  - { q: "هل هناك رسوم تصدير على الأرز غير البسمتي؟", a: "تتغير سياسة التصدير الهندية للأرز بين حين وآخر. نتحقق من موقف المديرية العامة للتجارة الخارجية (DGFT) الحالي قبل كل عقد." }
