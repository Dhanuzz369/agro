  swarna: { name: "Swarna", description: "أرز متوسط الحبة من أندرا براديش، يُستخدم على نطاق واسع في بنغلاديش وأفريقيا." }
  ir36: { name: "IR36", description: "أرز أبيض طويل الحبة للأسواق الحساسة للسعر." }
faq:
  - { q: "ما نسب الكسر التي توفرونها؟", a: "5% و25% كسر كمعيار؛ و10% و15% عند الطلب." }
  - { q: "هل هناك رسوم تصدير على الأرز غير البسمتي؟", a: "تتغير سياسة التصدير الهندية للأرز بين حين وآخر. نتحقق من موقف المديرية العامة للتجارة الخارجية (DGFT) الحالي قبل كل عقد." }
  - { q: "من أي موانئ تشحنون الأرز غير البسمتي؟", a: "تشحن GoodBiz Agri أرز IR64 وسوارنا وIR36 من الميناء الهندي الأنسب لكل طلب بشروط FOB أو CFR أو CIF في حاويات 20 أو 40 قدماً." }
