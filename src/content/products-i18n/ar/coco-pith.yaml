name: "لب جوز الهند (كوكوبيت)"
summary: "تُصدّر GoodBiz Agri لب جوز الهند (كوكوبيت) — قوالب 5 كغ وأكياس زراعة وخلطات اللب والرقائق وقوالب صغيرة ورقائق قشر جوز الهند — من موردين في كارناتاكا وتاميل نادو وكيرالا، بدرجات مُعادَلة أو مغسولة أو خام، مع فحص مخبري لـ EC والحموضة والرمل."
originLine: "كارناتاكا وتاميل نادو وكيرالا — عدة موردين لألياف جوز الهند"
sourcingStory: "لب جوز الهند مادة ناعمة إسفنجية تتبقى عند استخلاص الألياف من قشر جوز الهند. نشتريه من عدة موردين في كارناتاكا وتاميل نادو وكيرالا، ونختار المورد لكل طلب بحسب الشكل والدرجة وقيمة EC التي يحتاجها المزارع. تُفحص كل دفعة مخبرياً لقيمة EC والحموضة والرمل قبل تعبئتها."
varieties:
  block-5kg: { name: "قوالب لب جوز الهند 5 كغ", description: "قوالب مضغوطة بنسبة 5:1 تتمدد إلى 65–80 لتراً من وسط الزراعة، بدرجات مُعادَلة أو مغسولة أو خام." }
  grow-bags: { name: "أكياس وألواح الزراعة", description: "أكياس جاهزة لزراعة الفراولة والطماطم والخيار، مفتوحة من الأعلى أو بثقوب زراعة مقطوعة مسبقاً." }
  pith-chip-mix: { name: "خلطات اللب والرقائق", description: "لب جوز الهند ممزوج بنسبة 70:30 أو 50:50 مع رقائق القشر لتهوية أصص التوت والأفوكادو." }
  bricks-discs: { name: "قوالب صغيرة وأقراص وحبيبات", description: "قوالب 650 غ وأقراص وحبيبات للإكثار وتجارة مستلزمات الحدائق، بعلامتك التجارية." }
  husk-chips: { name: "رقائق قشر جوز الهند", description: "رقائق مصنّفة من قشر جوز الهند للأوركيد والطماطم والفلفل وللخلطات جيدة التهوية." }
faq:
  - { q: "ما درجات EC التي يمكنكم توريدها من لب جوز الهند؟", a: "لب مُعادَل بأقل من 0.5 mS/cm، ومغسول بين 0.5 و1.0 mS/cm، وخام من 1.5 mS/cm فأكثر. تُفحص كل دفعة مخبرياً لقيمة EC والحموضة والرمل، ويحدد العقد طريقة قياس EC (مثل 1:5 وفق EN 13038)، لأن الطرق المختلفة تعطي قراءات مختلفة للمادة نفسها." }
  - { q: "ما الفرق بين لب جوز الهند المُعادَل والمغسول؟", a: "يزيل الغسيل معظم أملاح الصوديوم والبوتاسيوم. أما المعادلة فتذهب أبعد: يُعالَج اللب بنترات الكالسيوم ليحل محل الصوديوم والبوتاسيوم المرتبطين بالألياف، فلا يحبس الوسط الكالسيوم والمغنيسيوم اللذين يحتاجهما المحصول. وعادة تطلب البيوت المحمية للتوت والطماطم والخيار اللب المُعادَل." }
  - { q: "كم يتمدد قالب 5 كغ؟", a: "قالب 5 كغ مضغوط بنسبة 5:1 تقريباً ويتمدد إلى 65–80 لتراً من الوسط المفكك بعد نقعه." }
  - { q: "ما الأشكال وخيارات العلامة الخاصة التي تقدمونها؟", a: "توفر GoodBiz Agri قوالب 5 كغ وأكياس وألواح الزراعة وخلطات اللب والرقائق بنسبتي 70:30 و50:50 وقوالب 650 غ وأقراصاً وحبيبات ورقائق القشر. ويمكن تعبئة القوالب والأكياس المخصصة للتجزئة بعلامتك التجارية." }
  - { q: "ما المستندات المرافقة لشحنة لب جوز الهند؟", a: "ترافق كل شحنة شهادة صحة نباتية من جهاز الحجر الزراعي الهندي وشهادة منشأ ونتيجة التحليل المخبري. ويتم التبخير عبر جهة معتمدة عندما تطلبه دولة الوجهة، وتضيف بعض الدول شروطها الخاصة مثل منصات ISPM-15." }
  - { q: "هل يمكن استيراد لب جوز الهند إلى الاتحاد الأوروبي والمملكة المتحدة؟", a: "نعم. تستثني لائحة الاتحاد الأوروبي 2019/2072، الملحق السادس، أوساط الزراعة المصنوعة بالكامل من ألياف جوز الهند غير المستعملة من القيود على التربة وأوساط الزراعة، وتطبق المملكة المتحدة الاستثناء نفسه. وترافق كل شحنة شهادة صحة نباتية." }
