faq:
  - { q: "Was ist der Unterschied zwischen Chali und Kempu?", a: "Chali ist reife Arekanuss, die an der Küste Karnatakas in der Schale sonnengetrocknet wird und weiß bleibt; Kempu ist junge Nuss, die geschält, gekocht und getrocknet wird und dadurch rot wird." }
  - { q: "Ab welchen Häfen verschiffen Sie Arekanuss?", a: "GoodBiz Agri verschifft Arekanuss (Betelnuss) ab New Mangalore und Chennai zu FOB-, CFR- oder CIF-Bedingungen." }
