name: "Südindischer Reis"
summary: "GoodBiz Agri exportiert südindische Spezialreissorten — Sona Masoori (roh und gedämpft), Ponni, Kerala Matta, Seeraga Samba und Idli-Reis — gemahlen in Raichur, Mandya, Thanjavur und Palakkad."
originLine: "Mühlen in Raichur, Mandya, Thanjavur und Palakkad"
sourcingStory: "Südindischer Reis ist leichter und vielfältiger als die Langkornsorten, die die meisten Käufer kennen. Wir beziehen Sona Masoori aus dem Bewässerungsgebiet des Tungabhadra um Raichur, Ponni und Seeraga Samba aus den Mühlen des Kaveri-Deltas bei Thanjavur und Matta aus Palakkad und stimmen jede Partie auf das Gericht und den Markt ab, für die sie bestimmt ist."
varieties:
  sona-masoori-raw: { name: "Sona Masoori (roh)", description: "Leichter Mittelkornreis, das alltägliche Grundnahrungsmittel südindischer Küchen." }
  sona-masoori-steam: { name: "Sona Masoori (gedämpft)", description: "Vor dem Mahlen gedämpft für festere Körner und längere Haltbarkeit." }
  ponni: { name: "Ponni", description: "Weicher Mittelkornreis aus Tamil Nadu, beliebt in Südostasien und am Golf." }
  kerala-matta: { name: "Kerala Matta", description: "Parboiled-Reis mit roter Kleie aus Palakkad mit nussigem Geschmack." }
  seeraga-samba: { name: "Seeraga Samba", description: "Kleines, aromatisches Korn, in Tamil Nadu für Biryani verwendet." }
  idli-rice: { name: "Idli-Reis", description: "Kurzer, runder Parboiled-Reis für Idli- und Dosa-Teig." }
faq:
  - { q: "Was ist der Unterschied zwischen rohem und gedämpftem Sona Masoori?", a: "Gedämpfter Reis wird vor dem Mahlen leicht gedämpft, was festere gekochte Körner und eine längere Lagerfähigkeit ergibt." }
  - { q: "Können Sie Handelsmarken-Beutel für den Einzelhandel liefern?", a: "Ja, in BOPP- oder Jutesäcken zu 5, 10 und 25 kg mit Ihrer Marke." }
