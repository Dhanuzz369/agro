name: "Kurkuma"
summary: "GoodBiz Agri exportiert Kurkuma — frisch, getrocknete Erode-Finger, Salem-Knollen, Alleppey-Finger mit hohem Curcumin und Kurkumapulver — aus Erode und Salem in Tamil Nadu und Alappuzha in Kerala, verschifft ab dem passenden indischen Hafen, mit 2–5 % Curcumin und unter 10 % Feuchte."
originLine: "Erode, Salem und Alleppey — Indiens Kurkuma-Kernland"
sourcingStory: "Der regulierte Markt von Erode bestimmt den Preis für einen großen Teil der weltweiten Kurkuma. Polierte Finger und Knollen kaufen wir dort und in Salem bei jeder Ernte, und für Käufer, die Farbkraft benötigen, beziehen wir curcuminreiche Alleppey-Finger von Händlern in Kerala. Pulver wird auf Bestellung gemahlen, damit Curcumin und Mesh Ihrer Spezifikation entsprechen."
varieties:
  fresh: { name: "Frische Kurkuma", description: "Gewaschene, an der Luft getrocknete Rhizome, per Reefer in belüfteten Kartons verschifft." }
  dried-finger: { name: "Erode-Trockenfinger", description: "Gekochte, sonnengetrocknete und polierte Finger mit 2,5–3,5 % Curcumin." }
  alleppey-finger: { name: "Alleppey-Finger", description: "Curcuminreiche Kurkuma aus Kerala, bevorzugt für Extraktion und Färbung." }
  salem-bulb: { name: "Salem-Knollen", description: "Runde Knollen aus Salem, beliebt zum Mahlen." }
  powder: { name: "Kurkumapulver", description: "Auf Bestellung gemahlen, 60–80 Mesh, Curcumin in Güten von 2–5 %." }
faq:
  - { q: "Welche Curcumingehalte können Sie liefern?", a: "Kurkuma aus Erode und Salem weist typischerweise 2,5–4 % Curcumin auf; Alleppey-Finger 4,5–5 %. Pulver kann auf einen vorgegebenen Curcumingehalt gemischt werden." }
  - { q: "Können Sie die EU-Pestizidgrenzwerte einhalten?", a: "Ja. Wir beziehen und prüfen Partien gegen die EU-Rückstandshöchstgehalte und können vor der Verladung eine Analyse durch Dritte bereitstellen." }
  - { q: "Ab welchen Häfen verschiffen Sie Kurkuma?", a: "GoodBiz Agri verschifft Kurkuma-Finger, -Knollen und -Pulver ab dem passenden indischen Hafen zu FOB-, CFR- oder CIF-Bedingungen." }
