name: "Ingwer"
summary: "GoodBiz Agri exportiert getrockneten Ingwer (ungebleicht und gebleicht), weiteren ganzen Trockeningwer und frischen Ingwer aus Wayanad in Kerala sowie Kodagu und Hassan in Karnataka, verschifft ab dem passenden indischen Hafen — frischen Ingwer im Kühlcontainer."
originLine: "Wayanad, Kodagu und Hassan — der Ingwergürtel der Westghats"
sourcingStory: "Ingwer von den Hängen der Westghats ist für seine Schärfe und seinen Ölgehalt bekannt. Frischen Ingwer kaufen wir zur Erntezeit bei Anbauern in Wayanad, getrockneten Ingwer über den Gewürzhandel im passenden indischen Hafen, wo die Güte \"Cochin ginger\" seit Jahrhunderten gehandelt wird."
