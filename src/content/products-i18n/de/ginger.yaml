name: "Ingwer"
summary: "GoodBiz Agri exportiert frischen Ingwer, getrockneten ungebleichten Ingwer, getrockneten gebleichten Ingwer und sonstigen ganzen Ingwer aus Wayanad in Kerala sowie Kodagu und Hassan in Karnataka."
originLine: "Wayanad, Kodagu und Hassan — der Ingwergürtel der Westghats"
sourcingStory: "Ingwer von den Hängen der Westghats ist für seine Schärfe und seinen Ölgehalt bekannt. Frischen Ingwer kaufen wir zur Erntezeit bei Anbauern in Wayanad, getrockneten Ingwer über den Gewürzhandel in Kochi, wo die Güte \"Cochin ginger\" seit Jahrhunderten gehandelt wird."
varieties:
  fresh: { name: "Frischer Ingwer", description: "Gewaschene, an der Luft getrocknete Rhizome, für den Reefer-Versand in Kartons oder Netzsäcken verpackt." }
  dried-unbleached: { name: "Getrockneter ungebleichter Ingwer", description: "Geschälter, sonnengetrockneter Ingwer in Naturfarbe." }
  dried-bleached: { name: "Getrockneter gebleichter Ingwer", description: "Mit Kalk gebleicht für ein helles, gleichmäßiges Erscheinungsbild." }
  whole-other: { name: "Ganzer getrockneter Ingwer (sonstige)", description: "Ganzer Ingwer, weder zerkleinert noch gemahlen, nach Käufergüte." }
faq:
  - { q: "Wie wird frischer Ingwer verschifft?", a: "In 40-Fuß-Reefer-Containern bei etwa 12–13 °C mit rund 26 Tonnen Ladung." }
