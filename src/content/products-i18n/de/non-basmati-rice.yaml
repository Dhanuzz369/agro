name: "Nicht-Basmati-Reis"
summary: "GoodBiz Agri exportiert Nicht-Basmati-Reis in Großmengen — IR64 roh und parboiled, Swarna und IR36 mit 5 % und 25 % Bruchanteil — aus Mühlen im Godavari-Delta, in Nellore und Raichur."
originLine: "Mühlen im Godavari-Delta, in Nellore und Raichur"
sourcingStory: "Das Godavari-Delta und der Distrikt Nellore in Andhra Pradesh gehören zu den größten Reisanbaugebieten Indiens. Wir arbeiten dort mit Mühlen zusammen, die über Sortex-Anlagen verfügen, um gleichbleibenden IR64 und Swarna in den Bruchklassen zu liefern, die afrikanische und asiatische Importeure vorgeben."
varieties:
