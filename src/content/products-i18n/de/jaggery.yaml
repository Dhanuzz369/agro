originLine: "Mandya, Belagavi und Thoothukudi"
sourcingStory: "Der Zuckerrohrgürtel von Mandya stellt seit Generationen Jaggery her, indem frischer Zuckerrohrsaft in offenen Pfannen eingekocht wird. Blöcke und Bio-Jaggery kaufen wir dort, Würfel und Pulver bei Verarbeitern in Belagavi und Palmjaggery bei den Palmyrapalmen-Zapfern in Thoothukudi."
