reviewStatus: pending
name: "Jaggery"
summary: "GoodBiz Agri exportiert Jaggery — Blöcke, Würfel, Pulver, Bio-Jaggery und Palmjaggery (Karupatti) — aus Mandya und Belagavi in Karnataka sowie Thoothukudi in Tamil Nadu."
originLine: "Mandya, Belagavi und Thoothukudi"
sourcingStory: "Der Zuckerrohrgürtel von Mandya stellt seit Generationen Jaggery her, indem frischer Zuckerrohrsaft in offenen Pfannen eingekocht wird. Blöcke und Bio-Jaggery kaufen wir dort, Würfel und Pulver bei Verarbeitern in Belagavi und Palmjaggery bei den Palmyrapalmen-Zapfern in Thoothukudi."
varieties:
  block: { name: "Jaggery-Blöcke", description: "Traditionelle geformte Blöcke, goldfarben bis dunkelbraun." }
  cube: { name: "Jaggery-Würfel", description: "Kleine Würfel für Einzelhandel und Gastronomie." }
  powder: { name: "Jaggery-Pulver", description: "Rieselfähiges Granulat für Bäckereien und Getränke." }
  organic: { name: "Bio-Jaggery", description: "Ohne chemische Klärung hergestellt." }
  palm-karupatti: { name: "Palmjaggery (Karupatti)", description: "Aus dem Saft der Palmyrapalme im Süden von Tamil Nadu hergestellt." }
faq:
  - { q: "Wie lange ist Jaggery haltbar?", a: "Etwa 12 Monate bei kühler, trockener Lagerung; Pulver und vakuumverpackte Blöcke halten sich am besten." }
  - { q: "Können Sie Handelsmarken liefern?", a: "Ja, in Packungen von 500 g bis 5 kg mit Ihrer Marke." }
