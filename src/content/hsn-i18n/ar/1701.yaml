title: "سكر القصب أو الشمندر، بما في ذلك الجاغري"
description: "يشمل البند HSN 1701 سكر القصب والشمندر في الحالة الصلبة، بما في ذلك الجاغري (gur)."
notes: "تشحن GoodBiz Agri ضمن هذا البند قوالب الجاغري ومكعباته ومسحوقه والجاغري العضوي وجاغري النخيل."
faq:
  - { q: "هل يُصنَّف الجاغري سكرًا؟", a: "نعم، الجاغري سكر قصب غير مُكرَّر (لا يُفصل بالطرد المركزي) ضمن البند 1701." }
  - { q: "هل يستخدم مسحوق الجاغري البند نفسه؟", a: "نعم." }
