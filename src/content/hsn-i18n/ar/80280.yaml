title: "جوز الأريكا"
description: "يُصنَّف جوز الأريكا (جوز التنبول) تحت البند HSN 0802 80، مع بنود فرعية للثمار الكاملة والمشقوقة والمطحونة."
notes: "يُعرض الرمز كما ورد من GoodBiz Agri وهو قيد التحقق. تأكد من البند الكامل المكوّن من 8 أرقام مع مخلّصك الجمركي."
faq:
