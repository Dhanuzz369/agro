title: "الأرز"
description: "يشمل البند HSN 1006 الأرز بجميع أشكاله — الأرز الخام (paddy)، والمقشور (البني)، ونصف المبيَّض أو المبيَّض كليًا، والمكسور."
notes: "Sona Masoori وPonni وMatta وغيرها من أصناف جنوب الهند أرز غير بسمتي؛ ويعتمد البند المكوّن من 8 أرقام على الطحن والسلق."
faq:
  - { q: "أي أصناف الأرز تندرج تحت 1006؟", a: "كل أنواع الأرز، بما فيها Sona Masoori وPonni وKerala Matta وSeeraga Samba وأرز إيدلي." }
  - { q: "هل البسمتي ضمن البند نفسه؟", a: "نعم، لكن للبسمتي بنودًا فرعية خاصة به. تُصدّر GoodBiz Agri أصناف الأرز غير البسمتي." }
