title: "زنجبيل آخر، غير مسحوق وغير مطحون"
description: "يشمل رمز HSN 09101190 الزنجبيل غير المذكور في موضع آخر، غير المسحوق وغير المطحون."
notes: "يُستخدم لأشكال الزنجبيل الكامل خارج بندَي الطازج والمجفف."
faq:
  - { q: "متى يُستخدم هذا الرمز؟", a: "للزنجبيل الكامل الذي لا يُصنَّف طازجًا ولا مجففًا مبيَّضًا أو غير مبيَّض." }
  - { q: "هل يمكنكم إرشادنا إلى الرمز الصحيح؟", a: "نعم — أرسلوا وصف منتجكم وسنقترح البند الذي ينبغي تأكيده مع مخلّصكم الجمركي." }
