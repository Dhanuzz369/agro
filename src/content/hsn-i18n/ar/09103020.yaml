reviewStatus: pending
title: "كركم مجفف"
description: "يشمل رمز HSN 09103020 الكركم المجفف الكامل — الأصابع والكُتَل — غير المسحوق وغير المطحون."
notes: "يشمل أصابع وكُتَل إيرود وسالم وألّيبّي."
faq:
  - { q: "ما نسبة الكركمين في الأصابع المجففة؟", a: "2.5–3.5% لإيرود، وحتى 5% لأصابع ألّيبّي." }
  - { q: "هل الأصابع مصقولة؟", a: "نعم، بصقل مفرد أو مزدوج عند الطلب." }
