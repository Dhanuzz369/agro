title: "جوز الهند والكوبرا"
description: "يُصنَّف جوز الهند والكوبرا تحت البند HSN 0801 (جوز الهند) وبنود ذات صلة للُّب المجفف."
notes: "يُعرض الرمز كما ورد من المورّد وهو قيد التحقق. وقد تُصنَّف الكوبرا ضمن بند منفصل في بعض الجداول."
faq:
  - { q: "ما منتجات جوز الهند التي تُصدّرونها؟", a: "جوز هند نصف مقشَّر، وكوبرا تيبتور الكروية، وكوبرا العصر، وأكواب كوبرا صالحة للأكل." }
  - { q: "لماذا الرمز قيد التحقق؟", a: "يختلف التصنيف بين جوز الهند الطازج والكوبرا المجففة؛ ونعمل على تأكيد كل بند." }
