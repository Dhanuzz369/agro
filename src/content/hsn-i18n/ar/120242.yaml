title: "الفول السوداني المقشور"
description: "يشمل رمز HSN 1202 42 الفول السوداني (peanuts) المقشور، سواء كان مكسورًا أم لا، غير المحمص أو المطبوخ بأي طريقة أخرى."
notes: "يُعرض الرمز كما ورد من المورّد وهو قيد التحقق بالنسبة إلى البند المكوّن من 8 أرقام."
