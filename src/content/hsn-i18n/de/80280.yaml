title: "Arekanüsse"
description: "Arekanüsse (Betelnüsse) werden unter der HSN-Position 0802 80 eingereiht, mit Unterzeilen für ganze, gespaltene und gemahlene Nüsse."
notes: "Der Code wird wie von GoodBiz Agri angegeben angezeigt und wird noch geprüft. Bestätigen Sie die vollständige achtstellige Zeile mit Ihrem Zollagenten."
faq:
  - { q: "Welche Arekanuss-Güten exportieren Sie?", a: "Ganze weiße Chali, gespalten, rote Kempu (Api und Bette) und in Scheiben." }
  - { q: "Warum wird der Code noch geprüft?", a: "Wir bestätigen die genaue achtstellige Zeile für jede Güte, bevor wir sie veröffentlichen." }
