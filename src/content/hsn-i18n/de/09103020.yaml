title: "Getrocknete Kurkuma"
description: "HSN 09103020 umfasst getrocknete ganze Kurkuma — Finger und Knollen —, weder zerkleinert noch gemahlen."
notes: "Umfasst Finger und Knollen aus Erode, Salem und Alleppey."
faq:
  - { q: "Welchen Curcumingehalt haben getrocknete Finger?", a: "2,5–3,5 % bei Erode, bis zu 5 % bei Alleppey-Fingern." }
  - { q: "Sind die Finger poliert?", a: "Ja, auf Anfrage einfach oder doppelt poliert." }
