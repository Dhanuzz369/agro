title: "Reis"
description: "Die HSN-Position 1006 umfasst Reis in allen Formen — Paddy, geschält (Braunreis), teilweise oder vollständig geschliffen sowie Bruch."
notes: "Sona Masoori, Ponni, Matta und andere südindische Sorten sind Nicht-Basmati-Reis; die achtstellige Zeile hängt von Mahlgrad und Parboiling ab."
faq:
  - { q: "Welche Reissorten fallen unter 1006?", a: "Aller Reis, einschließlich Sona Masoori, Ponni, Kerala Matta, Seeraga Samba und Idli-Reis." }
  - { q: "Fällt Basmati unter dieselbe Position?", a: "Ja, aber Basmati hat eigene Unterpositionen. GoodBiz Agri exportiert Nicht-Basmati-Sorten." }
