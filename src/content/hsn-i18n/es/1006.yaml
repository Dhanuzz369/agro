title: "Arroz"
description: "La partida HSN 1006 abarca el arroz en todas sus formas: con cáscara, descascarillado (integral), semiblanqueado o blanqueado, y partido."
notes: "El Sona Masoori, el Ponni, el Matta y otras variedades del sur de la India son arroz no basmati; la línea de 8 dígitos depende de la molienda y del parboiled."
faq:
  - { q: "¿Qué variedades de arroz entran en la partida 1006?", a: "Todo el arroz, incluidos Sona Masoori, Ponni, Kerala Matta, Seeraga Samba y arroz para idli." }
  - { q: "¿Está el basmati en la misma partida?", a: "Sí, pero el basmati tiene sus propias subpartidas. GoodBiz Agri exporta variedades no basmati." }
