title: "Maní, pelado"
description: "El HSN 1202 42 abarca el maní (cacahuate) pelado, partido o no, sin tostar ni cocinar de otro modo."
notes: "El código se muestra tal como se nos proporcionó y está en verificación para la línea de 8 dígitos."
faq:
