title: "Azúcar de caña o de remolacha, incluido el jaggery"
description: "La partida HSN 1701 abarca el azúcar de caña y de remolacha en forma sólida, incluido el jaggery (gur)."
notes: "GoodBiz Agri envía bloques, cubos, polvo, jaggery orgánico y jaggery de palma bajo esta partida."
faq:
  - { q: "¿Se clasifica el jaggery como azúcar?", a: "Sí, el jaggery es azúcar de caña no centrifugada bajo la partida 1701." }
  - { q: "¿Usa la misma partida el jaggery en polvo?", a: "Sí." }
