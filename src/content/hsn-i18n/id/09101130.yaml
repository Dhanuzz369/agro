title: "Jahe kering, diputihkan"
description: "HSN 09101130 mencakup jahe kering yang diputihkan, tidak dihancurkan maupun digiling."
notes: "Diputihkan dengan kapur agar tampak pucat dan seragam."
faq:
  - { q: "Bagaimana jahe diputihkan?", a: "Secara tradisional dengan kapur; batas belerang disepakati dengan pembeli." }
  - { q: "Pasar mana yang menyukai jahe diputihkan?", a: "Terutama pasar Timur Tengah dan sebagian pasar Asia." }
