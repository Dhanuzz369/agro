reviewStatus: pending
title: "Beras"
description: "Pos HSN 1006 mencakup beras dalam semua bentuk — gabah, pecah kulit (cokelat), setengah giling atau giling penuh, dan patah."
notes: "Sona Masoori, Ponni, Matta, dan varietas India Selatan lainnya adalah beras non-basmati; baris 8 digit bergantung pada penggilingan dan parboiling."
faq:
  - { q: "Varietas beras apa yang termasuk dalam 1006?", a: "Semua beras, termasuk Sona Masoori, Ponni, Kerala Matta, Seeraga Samba, dan beras idli." }
  - { q: "Apakah basmati termasuk pos yang sama?", a: "Ya, tetapi basmati memiliki sub-pos sendiri. GoodBiz Agri mengekspor varietas non-basmati." }
