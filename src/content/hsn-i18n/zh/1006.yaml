title: "大米"
description: "HSN 品目 1006 涵盖各种形态的大米——稻谷、糙米、半碾磨或全碾磨米以及碎米。"
notes: "Sona Masoori、Ponni、Matta 及其他南印度品种均属非印度香米；8位税号取决于碾磨和蒸谷处理。"
faq:
  - { q: "哪些大米品种属于 1006？", a: "所有大米，包括 Sona Masoori、Ponni、Kerala Matta、Seeraga Samba 和 idli 米。" }
  - { q: "印度香米属于同一品目吗？", a: "是的，但印度香米有自己的子目。GoodBiz Agri 出口的是非印度香米品种。" }
