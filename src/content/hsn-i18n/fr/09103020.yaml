title: "Curcuma séché"
description: "Le code HSN 09103020 couvre le curcuma séché entier — doigts et bulbes — ni broyé ni moulu."
notes: "Comprend les doigts et bulbes d'Erode, de Salem et d'Alleppey."
faq:
  - { q: "Quelle teneur en curcumine ont les doigts séchés ?", a: "2,5–3,5 % pour Erode, jusqu'à 5 % pour les doigts d'Alleppey." }
  - { q: "Les doigts sont-ils polis ?", a: "Oui, polis une ou deux fois sur demande." }
