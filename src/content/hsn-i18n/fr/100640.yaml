title: "Riz brisé"
description: "Le code SH 100640 couvre le riz brisé — fragments de riz blanchi."
notes: "Comprend les brisures blanches à 100 %, étuvées et triées au sortex pour l'alimentation, la brasserie et l'alimentation animale."
faq:
  - { q: "Qu'appelle-t-on riz brisé ?", a: "Des fragments de grain inférieurs aux trois quarts de la longueur du grain entier." }
  - { q: "Où le riz brisé est-il demandé ?", a: "En Afrique de l'Ouest, dans certaines parties de l'Asie, dans les brasseries et les fabriques d'aliments pour animaux." }
