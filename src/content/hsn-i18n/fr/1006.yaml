title: "Riz"
description: "La position SH 1006 couvre le riz sous toutes ses formes — paddy, décortiqué (complet), semi-blanchi ou blanchi, et brisé."
notes: "Le Sona Masoori, le Ponni, le Matta et les autres variétés d'Inde du Sud sont du riz non basmati ; la ligne à 8 chiffres dépend de l'usinage et de l'étuvage."
faq:
  - { q: "Quelles variétés de riz relèvent de la position 1006 ?", a: "Tous les riz, y compris le Sona Masoori, le Ponni, le Kerala Matta, le Seeraga Samba et le riz pour idli." }
  - { q: "Le basmati relève-t-il de la même position ?", a: "Oui, mais le basmati a ses propres sous-positions. GoodBiz Agri exporte des variétés non basmati." }
