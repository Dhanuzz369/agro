reviewStatus: pending
title: "Сушёная куркума"
description: "HSN 09103020 охватывает сушёную цельную куркуму — пальцы и луковицы — не дроблёную и не молотую."
notes: "Включает пальцы и луковицы Erode, Salem и Alleppey."
faq:
  - { q: "Какой куркумин в сушёных пальцах?", a: "2,5–3,5% у Erode, до 5% у пальцев Alleppey." }
  - { q: "Пальцы полированные?", a: "Да, с однократной или двукратной полировкой по запросу." }
