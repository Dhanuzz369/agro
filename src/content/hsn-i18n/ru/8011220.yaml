title: "Кокосы и копра"
description: "Кокосы и копра классифицируются по позиции HSN 0801 (кокосы) и связанным позициям для сушёного ядра."
notes: "Код указан в том виде, в каком он предоставлен, и находится на проверке. В некоторых схемах копра может классифицироваться по отдельной позиции."
faq:
