title: "Açúcar de cana ou de beterraba, incluindo jaggery"
description: "A posição HSN 1701 abrange o açúcar de cana e de beterraba em forma sólida, incluindo o jaggery (gur)."
notes: "A GoodBiz Agri embarca blocos, cubos, pó, jaggery orgânico e jaggery de palma sob esta posição."
faq:
  - { q: "O jaggery é classificado como açúcar?", a: "Sim, o jaggery é açúcar de cana não centrifugado sob a posição 1701." }
  - { q: "O jaggery em pó usa a mesma posição?", a: "Sim." }
