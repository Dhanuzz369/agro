title: "Arroz"
description: "A posição HSN 1006 abrange o arroz em todas as formas: em casca, descascado (integral), semibeneficiado ou beneficiado, e quebrado."
notes: "Sona Masoori, Ponni, Matta e outras variedades do sul da Índia são arroz não basmati; a linha de 8 dígitos depende do beneficiamento e da parboilização."
faq:
  - { q: "Quais variedades de arroz se enquadram na 1006?", a: "Todo o arroz, inclusive Sona Masoori, Ponni, Kerala Matta, Seeraga Samba e arroz para idli." }
  - { q: "O basmati está na mesma posição?", a: "Sim, mas o basmati tem subposições próprias. A GoodBiz Agri exporta variedades não basmati." }
