          - text: नारियल विकास बोर्ड एक सांविधिक निकाय है जो उत्‍पादकता सुधार और उत्‍पाद विविधीकरण को फोकस करके देश में नारियल की खेती और उद्योग के एकीकृत विकास हेतु
          - link [ref=f1e855] [cursor=pointer]:
            - /url: https://agricoop.gov.in/
            - text: कृषि एवं किसान कल्याण मंत्रालय, भारत सरकार
          - text: के अधीन स्‍थापित है। इस साइट की रूपकल्‍पना, विषय सामग्री का स्‍वामित्‍व और इसका अनुरक्षण एवं अद्यतन कार्य नारियल विकास बोर्ड, कोची, भारत द्वारा किया जाता है।
          - link [ref=f1e856] [cursor=pointer]:
            - /url: https://www.nic.in/
            - text: नेशनल इंफोर्मेटिक्‍स सेंटर
          - text: ने इसे होस्ट किया है, इस साइट में दी गई विषय सामग्री से संबंधित सभी पूछताछ/राय cdb-kochi(at)coconutboard(dot)gov(dot)in को भेजें।
