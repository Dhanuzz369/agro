              - paragraph [ref=f13e105]: Export Promotion Mission NEW!
              - paragraph [ref=f13e106]: The Export Promotion Mission (EPM) is a comprehensive initiative aimed at strengthening India’s export competitiveness, with a particular focus on enhancing MSME participation in global trade.
              - paragraph [ref=f13e107]: "The Mission operates through two complementary sub-schemes: NIRYAT PROTSAHAN, which improves access to trade finance through instruments such as interest subvention, collateral support and alternative credit mechanisms; and NIRYAT DISHA, which supports export quality and compliance, branding and packaging, market access, logistics and warehousing, and trade intelligence. For further information, please click on “View Details.”"
              - link "View Details" [ref=f13e108] [cursor=pointer]:
                - /url: javascript:;
            - generic [ref=f13e110]:
              - paragraph [ref=f13e111]: Register for your IEC
              - paragraph [ref=f13e112]: The Importer -Exporter Code (IEC) is a key business identification number which is mandatory for Exports or Imports. No person shall make any import or export except under an IEC Number granted by the DGFT. In case of import or export of services or technology, the IEC shall be required only when the service or technology provider is taking benefits under the Foreign Trade Policy or is dealing with specified services or technologies
